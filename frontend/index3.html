<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸艺工坊 · Index3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #faf8f3;
            --surface: #ffffff;
            --surface-soft: #f5f2ec;
            --border: rgba(0, 0, 0, 0.06);
            --text-primary: #2d2a24;
            --text-muted: #8a857b;
            --accent-terra: #c75c3a;
            --accent-sage: #7a9e7e;
            --accent-slate: #6b8db2;
            --accent-gold: #d4a843;
            --accent-lilac: #9b8ec4;
            --shadow-card: 0 2px 8px rgba(45, 42, 36, 0.06), 0 8px 24px rgba(45, 42, 36, 0.04);
            --shadow-hover: 0 4px 16px rgba(45, 42, 36, 0.1), 0 16px 48px rgba(45, 42, 36, 0.06);
            --topbar: 76px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text-primary);
            font-family: "Noto Sans SC", sans-serif;
            background:
                repeating-linear-gradient(0deg, rgba(45, 42, 36, 0.018) 0 1px, transparent 1px 6px),
                repeating-linear-gradient(90deg, rgba(45, 42, 36, 0.012) 0 1px, transparent 1px 8px),
                var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .paper-page {
            min-height: 100vh;
        }

        .paper-topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(180px, auto) minmax(260px, 520px) auto;
            align-items: center;
            gap: 18px;
            min-height: var(--topbar);
            padding: 14px clamp(18px, 4vw, 56px);
            background: rgba(250, 248, 243, 0.92);
            border-bottom: 1px solid rgba(45, 42, 36, 0.06);
            backdrop-filter: blur(12px);
        }

        .paper-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .paper-brand-mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: #fff;
            background: var(--accent-terra);
            box-shadow: 0 8px 18px rgba(199, 92, 58, 0.2);
            font-family: "Playfair Display", serif;
            font-size: 19px;
            font-weight: 700;
        }

        .paper-brand-text {
            display: block;
            min-width: 0;
            font-family: "Playfair Display", serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .paper-search {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 0 14px;
            border: 1px solid rgba(45, 42, 36, 0.08);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.76);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 26px rgba(45, 42, 36, 0.05);
        }

        .paper-search i {
            color: var(--accent-sage);
        }

        .paper-search input {
            width: 100%;
            min-width: 0;
            height: 44px;
            border: 0;
            outline: 0;
            color: var(--text-primary);
            background: transparent;
            font-size: 15px;
        }

        .paper-search input::placeholder {
            color: var(--text-muted);
        }

        .match-indicator {
            color: var(--text-muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .style-switch {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            white-space: nowrap;
        }

        .style-pill {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 13px;
            border-radius: 999px;
            color: var(--text-primary);
            background: var(--surface);
            box-shadow: var(--shadow-card);
            font-size: 13px;
            font-weight: 700;
            transition: transform 180ms ease, box-shadow 180ms ease, color 180ms ease;
        }

        .style-pill:hover,
        .style-pill:focus-visible {
            color: var(--accent-terra);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            outline: 0;
        }

        .paper-hero {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(240px, 360px);
            align-items: center;
            gap: clamp(28px, 6vw, 72px);
            max-width: 1180px;
            min-height: min(560px, calc(100vh - var(--topbar)));
            margin: 0 auto;
            padding: clamp(58px, 8vw, 96px) clamp(18px, 4vw, 34px) clamp(44px, 7vw, 76px);
        }

        .hero-kicker {
            margin: 0 0 14px;
            color: var(--accent-sage);
            font-size: 14px;
            font-weight: 700;
        }

        .paper-hero h1 {
            max-width: 760px;
            margin: 0;
            font-family: "Playfair Display", serif;
            font-size: clamp(42px, 8vw, 86px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .paper-hero p {
            max-width: 620px;
            margin: 22px 0 0;
            color: var(--text-muted);
            font-size: clamp(16px, 2vw, 19px);
            line-height: 1.9;
        }

        .hero-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .hero-stat {
            display: inline-flex;
            align-items: baseline;
            gap: 7px;
            min-height: 42px;
            padding: 0 14px;
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--shadow-card);
        }

        .hero-stat strong {
            color: var(--accent-terra);
            font-family: "Playfair Display", serif;
            font-size: 22px;
        }

        .hero-stat span {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
        }

        .paper-ornament {
            position: relative;
            min-height: 320px;
        }

        .paper-ornament span {
            position: absolute;
            display: block;
            background: var(--surface);
            box-shadow: var(--shadow-card);
        }

        .shape-circle {
            inset: 28px 58px auto auto;
            width: 168px;
            height: 168px;
            border-radius: 50%;
            border-top: 10px solid var(--accent-gold);
        }

        .shape-rect {
            inset: 148px auto auto 18px;
            width: 190px;
            height: 118px;
            border-radius: 22px;
            border-top: 10px solid var(--accent-sage);
            transform: rotate(-5deg);
        }

        .shape-small {
            inset: 48px auto auto 44px;
            width: 92px;
            height: 92px;
            border-radius: 20px;
            border-top: 10px solid var(--accent-slate);
            transform: rotate(9deg);
        }

        .paper-sections {
            display: flex;
            flex-direction: column;
            gap: clamp(42px, 7vw, 88px);
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 clamp(18px, 4vw, 34px) 76px;
        }

        .paper-section {
            --accent: var(--accent-terra);
            scroll-margin-top: calc(var(--topbar) + 22px);
        }

        .paper-section[hidden] {
            display: none;
        }

        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .section-kicker {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
        }

        .section-title {
            margin: 0;
            color: var(--text-primary);
            font-family: "Playfair Display", serif;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .section-desc {
            max-width: 660px;
            margin: 10px 0 0;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .section-count {
            flex: 0 0 auto;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            grid-auto-flow: dense;
            gap: 16px;
        }

        .paper-card {
            --accent: var(--accent-terra);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 174px;
            overflow: hidden;
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow-card);
            transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
        }

        .paper-card:hover,
        .paper-card:focus-visible {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            outline: 0;
        }

        .paper-card.is-dimmed {
            opacity: 0.15 !important;
            pointer-events: none;
        }

        .paper-card.featured {
            grid-column: span 2;
            grid-row: span 2;
            min-height: 364px;
        }

        .card-accent {
            height: 4px;
            background: var(--accent);
        }

        .paper-card-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 20px;
        }

        .card-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            margin-bottom: 18px;
            border-radius: 14px;
            color: #fff;
            background: var(--accent);
            box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 22%, transparent);
        }

        .paper-card h3 {
            margin: 0;
            color: var(--text-primary);
            font-size: 18px;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .paper-card p {
            margin: 10px 0 0;
            color: var(--text-muted);
            line-height: 1.75;
        }

        .paper-card.featured h3 {
            font-family: "Playfair Display", serif;
            font-size: clamp(26px, 4vw, 36px);
            line-height: 1.08;
        }

        .paper-card.featured p {
            font-size: 16px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: auto;
            padding-top: 18px;
        }

        .card-tags span {
            display: inline-flex;
            align-items: center;
            min-height: 25px;
            padding: 0 9px;
            border-radius: 999px;
            color: var(--text-primary);
            background: var(--surface-soft);
            font-size: 12px;
            font-weight: 700;
        }

        .resources-rail-wrap {
            position: relative;
        }

        .resources-rail {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            padding: 4px 2px 24px;
            cursor: grab;
            user-select: none;
        }

        .resources-rail::-webkit-scrollbar {
            display: none;
        }

        .resources-rail.is-dragging {
            cursor: grabbing;
            scroll-snap-type: none;
        }

        .resource-note {
            flex: 0 0 220px;
            min-height: 196px;
            border-radius: 16px;
            padding: 22px;
            color: #fff;
            background: var(--accent-gold);
            box-shadow: var(--shadow-card);
        }

        .resource-note strong {
            display: block;
            font-family: "Playfair Display", serif;
            font-size: 28px;
            line-height: 1.1;
        }

        .resource-note span {
            display: block;
            margin-top: 12px;
            line-height: 1.7;
            opacity: 0.86;
        }

        .resource-card {
            flex: 0 0 220px;
            min-height: 196px;
            scroll-snap-align: start;
        }

        .resource-card .paper-card-body {
            padding: 18px;
        }

        .resource-card h3 {
            font-size: 17px;
        }

        .no-results {
            display: none;
            min-height: 160px;
            place-items: center;
            border-radius: 18px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.66);
            box-shadow: var(--shadow-card);
            font-weight: 700;
        }

        .no-results.is-visible {
            display: grid;
        }

        .paper-footer {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 clamp(18px, 4vw, 34px) 44px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .back-top {
            position: fixed;
            right: 22px;
            bottom: 82px;
            z-index: 25;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            color: var(--accent-terra);
            background: var(--surface);
            box-shadow: var(--shadow-hover);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: opacity 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .back-top.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .back-top:hover,
        .back-top:focus-visible {
            transform: translateY(-3px);
            outline: 0;
        }

        .reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 520ms ease, transform 520ms ease;
        }

        .reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal .paper-card {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 520ms ease, transform 520ms ease, box-shadow 180ms ease;
            transition-delay: var(--delay, 0ms);
        }

        .reveal.is-visible .paper-card {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 980px) {
            .paper-topbar {
                grid-template-columns: 1fr;
                align-items: stretch;
                min-height: auto;
            }

            .style-switch {
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .paper-hero {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .paper-ornament {
                min-height: 230px;
                max-width: 360px;
            }
        }

        @media (max-width: 720px) {
            .paper-topbar {
                position: relative;
                padding: 16px;
            }

            .paper-brand-text {
                font-size: 22px;
            }

            .style-pill {
                flex: 1 1 auto;
                justify-content: center;
            }

            .paper-hero {
                padding-top: 30px;
                padding-bottom: 18px;
            }

            .paper-hero p {
                margin-top: 16px;
            }

            .hero-stats {
                gap: 10px;
                margin-top: 20px;
            }

            .paper-ornament {
                display: none;
            }

            .section-head {
                display: block;
            }

            .section-count {
                display: inline-block;
                margin-top: 10px;
            }

            .bento-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .paper-card.featured {
                grid-column: auto;
                grid-row: auto;
                min-height: 220px;
            }

            .resources-rail {
                margin-right: -16px;
                padding-right: 16px;
            }

            .resource-note,
            .resource-card {
                flex-basis: 228px;
            }

            .back-top {
                right: 18px;
                bottom: 76px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="paper-page" data-testid="paper-page">
        <header class="paper-topbar">
            <a class="paper-brand" href="index.html" aria-label="返回首页风格选择">
                <span class="paper-brand-mark">煜</span>
                <span class="paper-brand-text">煜的工具站</span>
            </a>

            <label class="paper-search" for="paperSearch">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input id="paperSearch" data-testid="paper-search" type="search" autocomplete="off" placeholder="搜索工具、资源、学习内容">
                <span class="match-indicator" id="matchIndicator">ALL</span>
            </label>

            <nav class="style-switch" aria-label="首页风格切换">
                <a class="style-pill" href="index.html">首页</a>
                <a class="style-pill" href="index1.html">星际奇妙站</a>
                <a class="style-pill" href="index2.html">赛博终端</a>
            </nav>
        </header>

        <section class="paper-hero">
            <div>
                <p class="hero-kicker">PAPER WORKSHOP</p>
                <h1>纸艺工坊 · 用温度整理你的工具箱</h1>
                <p>把工具、百度网盘资源、小游戏、学习内容和 AI 助手铺成一张清爽的工作台，打开就是全局视野。</p>
                <div class="hero-stats" id="heroStats" aria-label="栏目数量统计"></div>
            </div>
            <div class="paper-ornament" aria-hidden="true">
                <span class="shape-circle"></span>
                <span class="shape-rect"></span>
                <span class="shape-small"></span>
            </div>
        </section>

        <main class="paper-sections" id="paperSections"></main>
        <div class="paper-sections">
            <div class="no-results" id="paperNoResults" data-testid="paper-no-results">没有找到匹配内容</div>
        </div>

        <footer class="paper-footer">2026 · 三种首页风格共用同一套资源数据</footer>
        <button class="back-top" id="backTop" data-testid="paper-back-top" type="button" aria-label="回到顶部">
            <i class="fas fa-arrow-up" aria-hidden="true"></i>
        </button>
    </div>

    <script src="index.data.js"></script>
    <script>
        (function () {
            'use strict';

            const sectionConfig = [
                {
                    id: 'tools',
                    key: 'tools',
                    label: '工具银河',
                    kicker: 'TOOLS',
                    description: '转换、录制、资料、网页打包和常用工作入口。',
                    accent: '#c75c3a',
                    icon: 'fa-wrench',
                    tags: ['工具', '入口']
                },
                {
                    id: 'resources',
                    key: 'baiduResources',
                    label: '百度网盘资源',
                    kicker: 'BAIDU PAN',
                    description: '按卡片横向铺开，适合快速扫一遍可下载的网盘资源。',
                    accent: '#d4a843',
                    icon: 'fa-cloud-download-alt',
                    tags: ['百度网盘', '资源']
                },
                {
                    id: 'fun',
                    key: 'funGames',
                    label: '趣味星球',
                    kicker: 'PLAY',
                    description: '小游戏和互动实验，轻松进入也轻松离开。',
                    accent: '#7a9e7e',
                    icon: 'fa-gamepad',
                    tags: ['游戏', '互动']
                },
                {
                    id: 'learning',
                    key: 'learning',
                    label: '学习星河',
                    kicker: 'LEARNING',
                    description: '语文、数学、百科和 JS 逆向训练内容，适合反复打开。',
                    accent: '#6b8db2',
                    icon: 'fa-graduation-cap',
                    tags: ['学习', '训练']
                },
                {
                    id: 'ai',
                    key: 'ai',
                    label: 'AI 星云',
                    kicker: 'AI',
                    description: '常用 AI 助手入口，给写作、代码和资料整理留一条近路。',
                    accent: '#9b8ec4',
                    icon: 'fa-robot',
                    tags: ['AI', '助手']
                }
            ];

            const data = window.INDEX_DATA || {};
            const sectionsRoot = document.getElementById('paperSections');
            const searchInput = document.getElementById('paperSearch');
            const matchIndicator = document.getElementById('matchIndicator');
            const noResults = document.getElementById('paperNoResults');
            const heroStats = document.getElementById('heroStats');
            const backTop = document.getElementById('backTop');
            let suppressClickAfterDrag = false;

            function createEl(tag, className, text) {
                const node = document.createElement(tag);
                if (className) {
                    node.className = className;
                }
                if (typeof text === 'string') {
                    node.textContent = text;
                }
                return node;
            }

            function getItems(config) {
                return Array.isArray(data[config.key]) ? data[config.key] : [];
            }

            function normalize(value) {
                return String(value || '').toLowerCase();
            }

            function safeHref(url) {
                const raw = String(url || '').trim();
                try {
                    const parsed = new URL(raw, window.location.href);
                    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                        return raw;
                    }
                } catch (error) {
                    return '#';
                }
                return '#';
            }

            function createIcon(config) {
                const icon = createEl('span', 'card-icon');
                const iconNode = document.createElement('i');
                iconNode.className = 'fas ' + config.icon;
                iconNode.setAttribute('aria-hidden', 'true');
                icon.appendChild(iconNode);
                return icon;
            }

            function createCard(item, config, index, isResource) {
                const card = document.createElement('a');
                const href = safeHref(item.url);
                card.className = 'paper-card';
                if (index === 0 && !isResource) {
                    card.classList.add('featured');
                }
                if (isResource) {
                    card.classList.add('resource-card');
                }
                card.setAttribute('href', href);
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.dataset.testid = isResource ? 'paper-resource-card' : 'paper-card';
                card.dataset.sectionCard = config.id;
                card.style.setProperty('--accent', config.accent);
                card.style.setProperty('--delay', String(index * 80) + 'ms');
                card.setAttribute('data-search-index', normalize([
                    item.title,
                    item.description,
                    item.category,
                    Array.isArray(item.tags) ? item.tags.join(' ') : ''
                ].join(' ')));
                if (href === '#') {
                    card.setAttribute('aria-disabled', 'true');
                }

                const accent = createEl('div', 'card-accent');
                const body = createEl('div', 'paper-card-body');
                const title = createEl('h3', '', item.title || '未命名资源');
                const description = createEl('p', '', item.description || '暂无描述');
                const tags = createEl('div', 'card-tags');
                const cardTags = Array.isArray(item.tags) && item.tags.length ? item.tags : config.tags;

                body.appendChild(createIcon(config));
                body.appendChild(title);
                body.appendChild(description);

                cardTags.slice(0, 4).forEach(function (tag) {
                    tags.appendChild(createEl('span', '', tag));
                });
                if (isResource && item.category) {
                    tags.appendChild(createEl('span', '', item.category));
                }
                body.appendChild(tags);

                card.appendChild(accent);
                card.appendChild(body);
                card.addEventListener('click', function (event) {
                    if (suppressClickAfterDrag) {
                        event.preventDefault();
                    }
                });
                return card;
            }

            function renderHeroStats() {
                heroStats.replaceChildren();
                sectionConfig.forEach(function (config) {
                    const stat = createEl('span', 'hero-stat');
                    stat.appendChild(createEl('strong', '', String(getItems(config).length)));
                    stat.appendChild(createEl('span', '', config.label));
                    heroStats.appendChild(stat);
                });
            }

            function createSectionHeader(section, config, items) {
                const head = createEl('div', 'section-head');
                const titleWrap = createEl('div');
                titleWrap.appendChild(createEl('p', 'section-kicker', config.kicker));
                titleWrap.appendChild(createEl('h2', 'section-title', config.label));
                titleWrap.appendChild(createEl('p', 'section-desc', config.description));
                head.appendChild(titleWrap);
                head.appendChild(createEl('span', 'section-count', String(items.length) + ' 项'));
                section.appendChild(head);
            }

            function createResourceNote() {
                const note = createEl('div', 'resource-note');
                note.appendChild(createEl('strong', '', '百度网盘资源'));
                note.appendChild(createEl('span', '', '名称、描述、分类和标签集中展示。'));
                return note;
            }

            function enableRailDrag(rail) {
                let isDown = false;
                let startX = 0;
                let scrollLeft = 0;
                let moved = false;

                rail.addEventListener('pointerdown', function (event) {
                    isDown = true;
                    moved = false;
                    startX = event.clientX;
                    scrollLeft = rail.scrollLeft;
                    rail.classList.add('is-dragging');
                    rail.setPointerCapture(event.pointerId);
                });

                rail.addEventListener('pointermove', function (event) {
                    if (!isDown) {
                        return;
                    }
                    const delta = event.clientX - startX;
                    if (Math.abs(delta) > 4) {
                        moved = true;
                        suppressClickAfterDrag = true;
                    }
                    rail.scrollLeft = scrollLeft - delta;
                });

                function endDrag(event) {
                    if (!isDown) {
                        return;
                    }
                    isDown = false;
                    rail.classList.remove('is-dragging');
                    if (rail.hasPointerCapture(event.pointerId)) {
                        rail.releasePointerCapture(event.pointerId);
                    }
                    if (!moved) {
                        suppressClickAfterDrag = false;
                    } else {
                        window.setTimeout(function () {
                            suppressClickAfterDrag = false;
                        }, 0);
                    }
                }

                rail.addEventListener('pointerup', endDrag);
                rail.addEventListener('pointercancel', endDrag);
                rail.addEventListener('pointerleave', function (event) {
                    if (isDown) {
                        endDrag(event);
                    }
                });
            }

            function renderSections() {
                sectionsRoot.replaceChildren();
                sectionConfig.forEach(function (config) {
                    const items = getItems(config);
                    const section = document.createElement('section');
                    section.className = 'paper-section reveal';
                    section.id = config.id;
                    section.dataset.section = config.id;
                    section.dataset.testid = 'paper-section-' + config.id;
                    section.style.setProperty('--accent', config.accent);

                    createSectionHeader(section, config, items);

                    if (config.id === 'resources') {
                        const wrap = createEl('div', 'resources-rail-wrap');
                        const rail = createEl('div', 'resources-rail');
                        rail.dataset.testid = 'paper-resource-rail';
                        rail.appendChild(createResourceNote());
                        items.forEach(function (item, index) {
                            rail.appendChild(createCard(item, config, index, true));
                        });
                        wrap.appendChild(rail);
                        section.appendChild(wrap);
                        enableRailDrag(rail);
                    } else {
                        const grid = createEl('div', 'bento-grid');
                        items.forEach(function (item, index) {
                            grid.appendChild(createCard(item, config, index, false));
                        });
                        section.appendChild(grid);
                    }

                    sectionsRoot.appendChild(section);
                });
            }

            function applySearch() {
                const query = normalize(searchInput.value.trim());
                const sections = Array.from(document.querySelectorAll('.paper-section'));
                let totalMatches = 0;
                let totalCards = 0;

                sections.forEach(function (section) {
                    const cards = Array.from(section.querySelectorAll('[data-search-index]'));
                    let sectionMatches = 0;
                    totalCards += cards.length;

                    cards.forEach(function (card) {
                        const matched = !query || card.getAttribute('data-search-index').includes(query);
                        if (matched) {
                            sectionMatches += 1;
                            totalMatches += 1;
                        }
                        card.classList.toggle('is-dimmed', Boolean(query && !matched));
                        card.dataset.match = matched ? 'true' : 'false';
                    });

                    section.hidden = Boolean(query && sectionMatches === 0);
                });

                noResults.classList.toggle('is-visible', Boolean(query && totalMatches === 0));
                matchIndicator.textContent = query ? totalMatches + '/' + totalCards : 'ALL';
            }

            function setupReveal() {
                const sections = Array.from(document.querySelectorAll('.paper-section'));
                if (!('IntersectionObserver' in window)) {
                    sections.forEach(function (section) {
                        section.classList.add('is-visible');
                    });
                    return;
                }

                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.02 });

                sections.forEach(function (section) {
                    observer.observe(section);
                });
            }

            function setupBackTop() {
                function syncBackTop() {
                    const visible = window.scrollY > window.innerHeight * 0.8;
                    backTop.classList.toggle('is-visible', visible);
                    backTop.setAttribute('aria-hidden', visible ? 'false' : 'true');
                }

                backTop.addEventListener('click', function () {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                window.addEventListener('scroll', syncBackTop, { passive: true });
                syncBackTop();
            }

            renderHeroStats();
            renderSections();
            setupReveal();
            setupBackTop();
            applySearch();
            searchInput.addEventListener('input', applySearch);
        })();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>

</html>
