<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 小游戏</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8ef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: #776e65;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            background: rgba(250, 248, 239, 0.96);
            border-radius: 16px;
            padding: 16px;
            overflow: hidden;
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(187, 173, 160, 0.4);
        }

        .header-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #776e65;
        }

        .subtitle {
            font-size: 13px;
            color: #8f7a66;
            margin-top: 4px;
        }

        .score-boxes {
            display: flex;
            gap: 8px;
        }

        .score-box {
            min-width: 70px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #bbada0;
            color: #f9f6f2;
            text-align: center;
            font-size: 12px;
        }

        .score-box span.value {
            display: block;
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .hint {
            font-size: 12px;
            color: #8f7a66;
        }

        .btn-main {
            border: none;
            border-radius: 999px;
            padding: 9px 18px;
            background: #8f7a66;
            color: #f9f6f2;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 0 1px rgba(115, 98, 80, 0.6);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
        }

        .btn-main:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 0 0 1px rgba(249, 246, 242, 0.8);
        }

        .btn-undo {
            background: #bbada0;
        }

        .btn-undo:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .board-wrapper {
            margin-top: 6px;
        }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #bbada0;
            border-radius: 8px;
            padding: 2.5%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5%;
        }

        .tile {
            border-radius: 6px;
            background: #cdc1b4;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(18px, 5vw, 28px);
            font-weight: 700;
            color: #776e65;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: clamp(16px, 4.5vw, 24px); }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: clamp(16px, 4.5vw, 24px); }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: clamp(16px, 4.5vw, 24px); }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: clamp(14px, 3.8vw, 20px); }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: clamp(14px, 3.8vw, 20px); }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: clamp(12px, 3.2vw, 18px); }

        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #8f7a66;
        }

        /* 成就按钮 */
        .btn-achieve {
            border: none;
            border-radius: 999px;
            padding: 9px 18px;
            background: linear-gradient(135deg, #edcf72, #edc53f);
            color: #776e65;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 成就弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #faf8ef;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            margin: 0 0 16px;
            color: #776e65;
            text-align: center;
            font-size: 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #8f7a66;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            width: 28px;
            height: 28px;
        }

        .achieve-progress {
            text-align: center;
            color: #8f7a66;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .achievement-item {
            background: #cdc1b4;
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            opacity: 0.5;
            transition: all 0.3s;
        }

        .achievement-item.unlocked {
            opacity: 1;
            background: #edc53f;
        }

        .achievement-item .icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .achievement-item .name {
            font-size: 10px;
            font-weight: 600;
            color: #776e65;
            margin-bottom: 2px;
        }

        .achievement-item .desc {
            font-size: 8px;
            color: #8f7a66;
        }

        .achievement-item.unlocked .name,
        .achievement-item.unlocked .desc {
            color: #f9f6f2;
        }

        .clear-btn {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, 0.15);
            color: #c0392b;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 成就通知 */
        .achievement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            z-index: 2000;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            pointer-events: none;
        }

        .achievement-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #faf8ef;
            border: 2px solid #edc53f;
            border-radius: 10px;
            padding: 10px 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
        }

        .toast-icon {
            font-size: 1.6rem;
        }

        .toast-title {
            font-size: 11px;
            color: #edc53f;
            font-weight: 600;
        }

        .toast-name {
            font-size: 13px;
            color: #776e65;
            font-weight: 700;
        }

        /* 通关弹窗 */
        .win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(250, 248, 239, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .win-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .win-content {
            text-align: center;
            animation: winBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes winBounce {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-icon {
            font-size: 80px;
            animation: winPulse 1s ease-in-out infinite;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .win-title {
            font-size: 36px;
            font-weight: 700;
            color: #776e65;
            margin: 16px 0 8px;
        }

        .win-subtitle {
            font-size: 18px;
            color: #8f7a66;
            margin-bottom: 24px;
        }

        .win-score {
            font-size: 24px;
            color: #edc22e;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .win-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-win {
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-win:active {
            transform: scale(0.95);
        }

        .btn-win-primary {
            background: linear-gradient(135deg, #edc22e, #edcf72);
            color: #776e65;
        }

        .btn-win-secondary {
            background: #8f7a66;
            color: #f9f6f2;
        }

        /* 游戏结束弹窗 */
        .gameover-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 228, 218, 0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .gameover-modal.show {
            display: flex;
            animation: gameoverFade 0.5s ease;
        }

        @keyframes gameoverFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .gameover-content {
            text-align: center;
            animation: gameoverSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes gameoverSlide {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .gameover-icon {
            font-size: 60px;
            animation: gameoverShake 0.5s ease-in-out;
        }

        @keyframes gameoverShake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .gameover-title {
            font-size: 32px;
            font-weight: 700;
            color: #776e65;
            margin: 12px 0 8px;
        }

        .gameover-subtitle {
            font-size: 16px;
            color: #8f7a66;
            margin-bottom: 16px;
        }

        .gameover-score {
            font-size: 22px;
            color: #f67c5f;
            font-weight: 700;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-row">
            <div>
                <div class="title">2048</div>
                <div class="subtitle">合并数字方块，冲击 2048！</div>
            </div>
            <div class="score-boxes">
                <div class="score-box">
                    SCORE
                    <span class="value" id="score">0</span>
                </div>
                <div class="score-box">
                    BEST
                    <span class="value" id="best">0</span>
                </div>
            </div>
        </div>
        <div class="controls-row">
            <button class="btn-main" id="newGameBtn">新游戏</button>
            <button class="btn-main btn-undo" id="undoBtn">↩ 撤销</button>
            <button class="btn-achieve" id="btnAchieve">🏆 成就</button>
        </div>
        <div class="hint" style="text-align:center;margin-bottom:8px;">电脑：方向键控制，Z撤销 | 手机：滑动</div>
        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="tile" id="tile-0-0"></div>
                <div class="tile" id="tile-0-1"></div>
                <div class="tile" id="tile-0-2"></div>
                <div class="tile" id="tile-0-3"></div>
                <div class="tile" id="tile-1-0"></div>
                <div class="tile" id="tile-1-1"></div>
                <div class="tile" id="tile-1-2"></div>
                <div class="tile" id="tile-1-3"></div>
                <div class="tile" id="tile-2-0"></div>
                <div class="tile" id="tile-2-1"></div>
                <div class="tile" id="tile-2-2"></div>
                <div class="tile" id="tile-2-3"></div>
                <div class="tile" id="tile-3-0"></div>
                <div class="tile" id="tile-3-1"></div>
                <div class="tile" id="tile-3-2"></div>
                <div class="tile" id="tile-3-3"></div>
            </div>
        </div>
        <div class="status" id="status">合并相同数字方块，试着得到 2048！</div>
    </div>

    <!-- 成就弹窗 -->
    <div class="modal" id="achieveModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">×</button>
            <h2>🏆 游戏成就</h2>
            <p class="achieve-progress" id="achieveProgress"></p>
            <div class="achievements-grid" id="achieveContent"></div>
            <button class="clear-btn" id="clearDataBtn">🗑️ 清除所有记录</button>
        </div>
    </div>

    <!-- 成就通知 -->
    <div class="achievement-toast" id="achievementToast">
        <div class="toast-content">
            <div class="toast-icon" id="toastIcon">🏆</div>
            <div class="toast-info">
                <div class="toast-title">成就解锁！</div>
                <div class="toast-name" id="toastName"></div>
            </div>
        </div>
    </div>

    <!-- 通关弹窗 -->
    <div class="win-modal" id="winModal">
        <div class="win-content">
            <div class="win-icon">🏆</div>
            <div class="win-title">恭喜通关！</div>
            <div class="win-subtitle">你成功合成了 2048！</div>
            <div class="win-score" id="winScore">得分: 0</div>
            <div class="win-buttons">
                <button class="btn-win btn-win-secondary" id="btnContinue">继续游戏</button>
                <button class="btn-win btn-win-primary" id="btnNewGame">新游戏</button>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="gameover-modal" id="gameoverModal">
        <div class="gameover-content">
            <div class="gameover-icon">😢</div>
            <div class="gameover-title">游戏结束</div>
            <div class="gameover-subtitle">没有可移动的方块了</div>
            <div class="gameover-score" id="gameoverScore">得分: 0</div>
            <div class="win-buttons">
                <button class="btn-win btn-win-secondary" id="btnUndo">↩ 撤销一步</button>
                <button class="btn-win btn-win-primary" id="btnRetry">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        const size = 4;
        let board = [];
        let score = 0;
        let bestScore = 0;
        let gameOver = false;
        let hasWon = false; // 是否已经通关
        let touchStartX = null;
        let touchStartY = null;
        const winModal = document.getElementById("winModal");
        const gameoverModal = document.getElementById("gameoverModal");
        const undoBtn = document.getElementById("undoBtn");
        
        // 撤销功能
        let prevBoard = null;
        let prevScore = 0;
        let canUndo = false;
        
        function saveState() {
            prevBoard = board.map(row => row.slice());
            prevScore = score;
            canUndo = true;
            undoBtn.disabled = false;
        }
        
        function undo() {
            if (!canUndo || !prevBoard) return;
            board = prevBoard.map(row => row.slice());
            score = prevScore;
            gameOver = false;
            canUndo = false;
            undoBtn.disabled = true;
            updateBoardView();
            setStatus("已撤销，继续加油！");
        }

        const boardEl = document.getElementById("board");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const statusEl = document.getElementById("status");
        const newGameBtn = document.getElementById("newGameBtn");
        const btnAchieve = document.getElementById("btnAchieve");
        const achieveModal = document.getElementById("achieveModal");

        // 成就定义
        const achievements = [
            { id: 'tile_4', name: '初来乍到', desc: '合成4', icon: '🌱' },
            { id: 'tile_8', name: '小试牛刀', desc: '合成8', icon: '🎯' },
            { id: 'tile_16', name: '渐入佳境', desc: '合成16', icon: '📈' },
            { id: 'tile_32', name: '步步高升', desc: '合成32', icon: '🔥' },
            { id: 'tile_64', name: '势如破竹', desc: '合成64', icon: '💪' },
            { id: 'tile_128', name: '小有成就', desc: '合成128', icon: '⭐' },
            { id: 'tile_256', name: '更进一步', desc: '合成256', icon: '🚀' },
            { id: 'tile_512', name: '高手进阶', desc: '合成512', icon: '💎' },
            { id: 'tile_1024', name: '王者之路', desc: '合成1024', icon: '👑' },
            { id: 'tile_2048', name: '通关大师', desc: '合成2048', icon: '🏆' },
            { id: 'games_10', name: '游戏爱好者', desc: '累计游戏10局', icon: '🎮' },
            { id: 'games_50', name: '游戏狂人', desc: '累计游戏50局', icon: '🌟' }
        ];

        // 加载成就数据
        function loadAchieveData() {
            try {
                const saved = localStorage.getItem("game_2048_achieve");
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { achievements: [], totalGames: 0, totalScore: 0 };
        }

        function saveAchieveData(data) {
            try {
                localStorage.setItem("game_2048_achieve", JSON.stringify(data));
            } catch (e) {}
        }

        let achieveData = loadAchieveData();

        // 成就通知
        let toastQueue = [];
        let isShowingToast = false;

        function showAchievementToast(achievement) {
            toastQueue.push(achievement);
            processToastQueue();
        }

        function processToastQueue() {
            if (isShowingToast || toastQueue.length === 0) return;
            isShowingToast = true;
            const achievement = toastQueue.shift();
            const toast = document.getElementById('achievementToast');
            document.getElementById('toastIcon').textContent = achievement.icon;
            document.getElementById('toastName').textContent = achievement.name;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    isShowingToast = false;
                    processToastQueue();
                }, 500);
            }, 3000);
        }

        function unlockAchievement(id) {
            if (achieveData.achievements.includes(id)) return;
            achieveData.achievements.push(id);
            saveAchieveData(achieveData);
            const a = achievements.find(x => x.id === id);
            if (a) showAchievementToast(a);
        }

        function checkTileAchievements() {
            let maxTile = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] > maxTile) maxTile = board[r][c];
                }
            }
            if (maxTile >= 4) unlockAchievement('tile_4');
            if (maxTile >= 8) unlockAchievement('tile_8');
            if (maxTile >= 16) unlockAchievement('tile_16');
            if (maxTile >= 32) unlockAchievement('tile_32');
            if (maxTile >= 64) unlockAchievement('tile_64');
            if (maxTile >= 128) unlockAchievement('tile_128');
            if (maxTile >= 256) unlockAchievement('tile_256');
            if (maxTile >= 512) unlockAchievement('tile_512');
            if (maxTile >= 1024) unlockAchievement('tile_1024');
            if (maxTile >= 2048) {
                unlockAchievement('tile_2048');
                // 首次通关显示弹窗
                if (!hasWon) {
                    hasWon = true;
                    showWinModal();
                }
            }
        }

        function showWinModal() {
            document.getElementById('winScore').textContent = '得分: ' + score;
            winModal.classList.add('show');
        }

        function showAchievements() {
            const count = achieveData.achievements ? achieveData.achievements.length : 0;
            document.getElementById('achieveProgress').textContent = `已解锁: ${count}/${achievements.length}`;
            document.getElementById('achieveContent').innerHTML = achievements.map(a => {
                const unlocked = achieveData.achievements && achieveData.achievements.includes(a.id);
                return `
                    <div class="achievement-item ${unlocked ? 'unlocked' : ''}">
                        <div class="icon">${unlocked ? a.icon : '🔒'}</div>
                        <div class="name">${a.name}</div>
                        <div class="desc">${a.desc}</div>
                    </div>
                `;
            }).join('');
            achieveModal.classList.add('show');
        }

        btnAchieve.addEventListener('click', showAchievements);
        document.getElementById('closeModal').addEventListener('click', () => achieveModal.classList.remove('show'));
        achieveModal.addEventListener('click', (e) => {
            if (e.target === achieveModal) achieveModal.classList.remove('show');
        });

        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if (confirm('确定要清除所有记录吗？\n包括最高分和成就进度，此操作不可恢复！')) {
                localStorage.removeItem("game_2048_achieve");
                localStorage.removeItem("game_2048_best");
                achieveData = { achievements: [], totalGames: 0, totalScore: 0 };
                bestScore = 0;
                bestEl.textContent = '0';
                achieveModal.classList.remove('show');
            }
        });

        try {
            const savedBest = localStorage.getItem("game_2048_best");
            if (savedBest !== null) {
                bestScore = parseInt(savedBest, 10) || 0;
                bestEl.textContent = bestScore;
            }
        } catch (e) {}

        function setStatus(text) {
            if (statusEl) {
                statusEl.textContent = text;
            }
        }

        function initBoard() {
            board = [];
            for (let r = 0; r < size; r++) {
                const row = [];
                for (let c = 0; c < size; c++) {
                    row.push(0);
                }
                board.push(row);
            }
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) {
                        empty.push({ r, c });
                    }
                }
            }
            if (!empty.length) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.95 ? 2 : 4; // 95%概率出2，更友好
        }

        function updateBoardView() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const value = board[r][c];
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    if (!tile) continue;
                    tile.textContent = value === 0 ? "" : String(value);
                    let cls = "tile";
                    if (value > 0 && value <= 2048) {
                        cls += " tile-" + value;
                    } else if (value > 2048) {
                        cls += " tile-super";
                    }
                    tile.className = cls;
                }
            }
            scoreEl.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestEl.textContent = bestScore;
                try {
                    localStorage.setItem("game_2048_best", String(bestScore));
                } catch (e) {}
            }
        }

        function compressAndMerge(line) {
            const original = line.slice();
            const nonZero = line.filter(v => v !== 0);
            let gained = 0;
            for (let i = 0; i < nonZero.length - 1; i++) {
                if (nonZero[i] !== 0 && nonZero[i] === nonZero[i + 1]) {
                    nonZero[i] *= 2;
                    gained += nonZero[i];
                    nonZero[i + 1] = 0;
                    i++;
                }
            }
            const merged = nonZero.filter(v => v !== 0);
            while (merged.length < size) {
                merged.push(0);
            }
            let moved = false;
            for (let i = 0; i < size; i++) {
                if (merged[i] !== original[i]) {
                    moved = true;
                    break;
                }
            }
            return { merged, moved, gained };
        }

        function moveLeft() {
            let anyMoved = false;
            let gainedTotal = 0;
            for (let r = 0; r < size; r++) {
                const row = board[r];
                const { merged, moved, gained } = compressAndMerge(row);
                board[r] = merged;
                if (moved) {
                    anyMoved = true;
                    gainedTotal += gained;
                }
            }
            if (anyMoved) {
                score += gainedTotal;
                addRandomTile();
                updateBoardView();
                checkTileAchievements();
                checkGameOver();
            }
        }

        function moveRight() {
            let anyMoved = false;
            let gainedTotal = 0;
            for (let r = 0; r < size; r++) {
                const row = board[r].slice().reverse();
                const { merged, moved, gained } = compressAndMerge(row);
                const restored = merged.reverse();
                board[r] = restored;
                if (moved) {
                    anyMoved = true;
                    gainedTotal += gained;
                }
            }
            if (anyMoved) {
                score += gainedTotal;
                addRandomTile();
                updateBoardView();
                checkTileAchievements();
                checkGameOver();
            }
        }

        function moveUp() {
            let anyMoved = false;
            let gainedTotal = 0;
            for (let c = 0; c < size; c++) {
                const col = [];
                for (let r = 0; r < size; r++) {
                    col.push(board[r][c]);
                }
                const { merged, moved, gained } = compressAndMerge(col);
                for (let r = 0; r < size; r++) {
                    board[r][c] = merged[r];
                }
                if (moved) {
                    anyMoved = true;
                    gainedTotal += gained;
                }
            }
            if (anyMoved) {
                score += gainedTotal;
                addRandomTile();
                updateBoardView();
                checkTileAchievements();
                checkGameOver();
            }
        }

        function moveDown() {
            let anyMoved = false;
            let gainedTotal = 0;
            for (let c = 0; c < size; c++) {
                const col = [];
                for (let r = 0; r < size; r++) {
                    col.push(board[r][c]);
                }
                col.reverse();
                const { merged, moved, gained } = compressAndMerge(col);
                const restored = merged.reverse();
                for (let r = 0; r < size; r++) {
                    board[r][c] = restored[r];
                }
                if (moved) {
                    anyMoved = true;
                    gainedTotal += gained;
                }
            }
            if (anyMoved) {
                score += gainedTotal;
                addRandomTile();
                updateBoardView();
                checkTileAchievements();
                checkGameOver();
            }
        }

        function hasMoves() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) return true;
                }
            }
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const v = board[r][c];
                    if (r + 1 < size && board[r + 1][c] === v) return true;
                    if (c + 1 < size && board[r][c + 1] === v) return true;
                }
            }
            return false;
        }

        function checkGameOver() {
            if (!hasMoves()) {
                gameOver = true;
                // 游戏结束，增加游戏局数
                achieveData.totalGames++;
                saveAchieveData(achieveData);
                if (achieveData.totalGames >= 10) unlockAchievement('games_10');
                if (achieveData.totalGames >= 50) unlockAchievement('games_50');
                // 显示游戏结束弹窗
                showGameoverModal();
            }
        }

        function showGameoverModal() {
            document.getElementById('gameoverScore').textContent = '得分: ' + score;
            document.getElementById('btnUndo').style.display = canUndo ? 'inline-block' : 'none';
            gameoverModal.classList.add('show');
        }

        function handleMove(direction) {
            if (gameOver) return;
            saveState();
            const oldScore = score;
            switch (direction) {
                case "left":
                    moveLeft();
                    break;
                case "right":
                    moveRight();
                    break;
                case "up":
                    moveUp();
                    break;
                case "down":
                    moveDown();
                    break;
            }
            if (score === oldScore && JSON.stringify(board) === JSON.stringify(prevBoard)) {
                canUndo = false;
                undoBtn.disabled = true;
            }
        }

        function newGame() {
            score = 0;
            gameOver = false;
            hasWon = false;
            canUndo = false;
            prevBoard = null;
            undoBtn.disabled = true;
            winModal.classList.remove('show');
            gameoverModal.classList.remove('show');
            setStatus("合并相同数字方块，试着得到 2048！");
            initBoard();
            addRandomTile();
            addRandomTile();
            updateBoardView();
        }

        // 通关弹窗按钮
        document.getElementById('btnContinue').addEventListener('click', () => {
            winModal.classList.remove('show');
        });

        document.getElementById('btnNewGame').addEventListener('click', () => {
            newGame();
        });

        // 游戏结束弹窗按钮
        document.getElementById('btnUndo').addEventListener('click', () => {
            gameoverModal.classList.remove('show');
            undo();
        });

        document.getElementById('btnRetry').addEventListener('click', () => {
            newGame();
        });

        // 撤销按钮
        undoBtn.addEventListener('click', undo);
        undoBtn.disabled = true;

        document.addEventListener("keydown", (e) => {
            let handled = false;
            switch (e.key) {
                case "ArrowLeft":
                    handleMove("left");
                    handled = true;
                    break;
                case "ArrowRight":
                    handleMove("right");
                    handled = true;
                    break;
                case "ArrowUp":
                    handleMove("up");
                    handled = true;
                    break;
                case "ArrowDown":
                    handleMove("down");
                    handled = true;
                    break;
                case "z":
                case "Z":
                    undo();
                    handled = true;
                    break;
            }
            if (handled) {
                e.preventDefault();
            }
        });

        if (newGameBtn) {
            newGameBtn.addEventListener("click", () => {
                newGame();
            });
        }

        boardEl.addEventListener("touchstart", (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        boardEl.addEventListener("touchend", (e) => {
            if (touchStartX === null || touchStartY === null) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            touchStartX = null;
            touchStartY = null;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            const threshold = 20;
            if (Math.max(absDx, absDy) < threshold) return;
            if (absDx > absDy) {
                handleMove(dx > 0 ? "right" : "left");
            } else {
                handleMove(dy > 0 ? "down" : "up");
            }
        });

        newGame();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>
</html>
