<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
            color: #e5e7eb;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            gap: 12px;
            padding: 20px 16px 18px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            box-shadow:
                0 18px 40px rgba(15, 23, 42, 0.9),
                0 0 0 1px rgba(148, 163, 184, 0.35);
        }

        .title {
            font-size: 26px;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: #bbf7d0;
            text-shadow: 0 0 18px rgba(34, 197, 94, 0.8);
            margin-bottom: 4px;
        }

        .score {
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        #gameCanvas {
            width: min(92vw, 360px);
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.8);
            background-color: #020617;
            image-rendering: pixelated;
        }

        .controls {
            font-size: 12px;
            line-height: 1.5;
            color: #9ca3af;
            text-align: center;
        }

        .mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-control,
        .btn-main,
        .btn-secondary {
            border: none;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 14px;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            color: #e5e7eb;
            box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.6);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
        }

        .btn-control {
            font-size: 18px;
        }

        .btn-main {
            flex: 1;
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: #022c22;
            font-weight: 600;
        }

        .btn-secondary {
            flex: 1;
        }

        .btn-control:active,
        .btn-main:active,
        .btn-secondary:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 0 0 1px rgba(226, 232, 240, 0.9);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .title {
                font-size: 22px;
            }

            .game-container {
                padding: 16px 12px 14px;
                border-radius: 18px;
            }
        }

        /* 成就按钮 */
        .achieve-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .achieve-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
        }

        /* 成就弹窗 */
        .achievement-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .achievement-modal.show {
            display: flex;
        }

        .achievement-content {
            background: #0f172a;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #fbbf24;
        }

        .achievement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
        }

        .achievement-header h2 {
            margin: 0;
            font-size: 1.2em;
        }

        .achievement-header .close-btn {
            background: none;
            border: none;
            color: #1f2937;
            font-size: 1.6em;
            cursor: pointer;
        }

        .achievement-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #1e293b;
            border: 1px solid #334155;
        }

        .achievement-item.unlocked {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
        }

        .achievement-item.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 1.8em;
            width: 40px;
            text-align: center;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-name {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .achievement-desc {
            font-size: 0.8em;
            color: #94a3b8;
        }

        .achievement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            padding: 12px 24px;
            border-radius: 25px;
            box-shadow: 0 5px 25px rgba(251, 191, 36, 0.4);
            z-index: 2000;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s;
            font-weight: 600;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-row">
            <div class="title">贪吃蛇</div>
            <button class="achieve-btn" onclick="showAchievementModal()">成就</button>
        </div>
        <div class="score">得分: <span id="scoreValue">0</span> ｜ 最高: <span id="bestScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div>电脑：方向键控制移动，空格键开始/暂停</div>
            <div>手机：点击下方方向键或在棋盘上滑动</div>
        </div>
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="btn-control" data-dir="up">▲</button>
            </div>
            <div class="mobile-row">
                <button class="btn-control" data-dir="left">◀</button>
                <button class="btn-control" data-dir="down">▼</button>
                <button class="btn-control" data-dir="right">▶</button>
            </div>
            <div class="mobile-row">
                <button class="btn-main" id="btnStartPause">开始 / 暂停</button>
                <button class="btn-secondary" id="btnRestart">重新开始</button>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-modal" id="achievementModal">
        <div class="achievement-content">
            <div class="achievement-header">
                <h2>🏆 贪吃蛇成就</h2>
                <button class="close-btn" onclick="closeAchievementModal()">×</button>
            </div>
            <div class="achievement-list" id="achievementList"></div>
        </div>
    </div>

    <script>
        // 成就系统
        const achievements = [
            { id: 'first_food', name: '初尝禁果', desc: '第一次吃到食物', icon: '🍎' },
            { id: 'score_50', name: '小试身手', desc: '单局得分达到50分', icon: '⭐' },
            { id: 'score_100', name: '渐入佳境', desc: '单局得分达到100分', icon: '🌟' },
            { id: 'score_200', name: '贪吃高手', desc: '单局得分达到200分', icon: '💫' },
            { id: 'score_500', name: '蛇王降临', desc: '单局得分达到500分', icon: '👑' },
            { id: 'games_5', name: '初来乍到', desc: '累计游戏5次', icon: '🎮' },
            { id: 'games_20', name: '乐此不疲', desc: '累计游戏20次', icon: '🎯' },
            { id: 'games_50', name: '贪吃蛇迷', desc: '累计游戏50次', icon: '🔥' },
            { id: 'length_10', name: '小蛇成长', desc: '蛇身长度达到10节', icon: '🐍' },
            { id: 'length_20', name: '巨蟒出没', desc: '蛇身长度达到20节', icon: '🐉' }
        ];

        let snakeData = { unlocked: [], totalGames: 0, eatenFirst: false };

        function loadSnakeData() {
            try {
                const saved = localStorage.getItem('snake_achievements');
                if (saved) snakeData = JSON.parse(saved);
            } catch(e) {}
        }

        function saveSnakeData() {
            try {
                localStorage.setItem('snake_achievements', JSON.stringify(snakeData));
            } catch(e) {}
        }

        function unlockAchievement(id) {
            if (snakeData.unlocked.includes(id)) return false;
            snakeData.unlocked.push(id);
            saveSnakeData();
            const ach = achievements.find(a => a.id === id);
            if (ach) showAchievementToast(ach);
            return true;
        }

        function showAchievementToast(ach) {
            const toast = document.createElement('div');
            toast.className = 'achievement-toast';
            toast.innerHTML = `${ach.icon} 成就解锁：${ach.name}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showAchievementModal() {
            renderAchievementList();
            document.getElementById('achievementModal').classList.add('show');
        }

        function closeAchievementModal() {
            document.getElementById('achievementModal').classList.remove('show');
        }

        function renderAchievementList() {
            const list = document.getElementById('achievementList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = snakeData.unlocked.includes(ach.id);
                return `
                    <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${ach.name}</div>
                            <div class="achievement-desc">${ach.desc}</div>
                        </div>
                        ${unlocked ? '<span style="color:#22c55e">✓</span>' : '<span style="color:#64748b">🔒</span>'}
                    </div>
                `;
            }).join('');
        }

        function checkAchievements() {
            // 检查分数成就
            if (score >= 50) unlockAchievement('score_50');
            if (score >= 100) unlockAchievement('score_100');
            if (score >= 200) unlockAchievement('score_200');
            if (score >= 500) unlockAchievement('score_500');
            // 检查长度成就
            if (snake.length >= 10) unlockAchievement('length_10');
            if (snake.length >= 20) unlockAchievement('length_20');
        }

        function onEatFood() {
            if (!snakeData.eatenFirst) {
                snakeData.eatenFirst = true;
                unlockAchievement('first_food');
            }
            checkAchievements();
        }

        function onGameOver() {
            snakeData.totalGames++;
            saveSnakeData();
            if (snakeData.totalGames >= 5) unlockAchievement('games_5');
            if (snakeData.totalGames >= 20) unlockAchievement('games_20');
            if (snakeData.totalGames >= 50) unlockAchievement('games_50');
        }

        loadSnakeData();

        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const directionButtons = document.querySelectorAll('.btn-control');
        const btnStartPause = document.getElementById('btnStartPause');
        const btnRestart = document.getElementById('btnRestart');
        const bestScoreElement = document.getElementById('bestScore');

        // 游戏常量
        const gridSize = 16;
        const gridWidth = canvas.width / gridSize;
        const gridHeight = canvas.height / gridSize;

        // 游戏变量
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let bestScore = 0;
        let gameStarted = false;
        let gamePaused = false;
        let gameSpeed = 150; // 初始速度，毫秒
        let gameLoop;
        let touchStartX = null;
        let touchStartY = null;

        try {
            const savedBest = localStorage.getItem('snake_best_score');
            if (savedBest !== null) {
                bestScore = parseInt(savedBest, 10) || 0;
                if (bestScoreElement) {
                    bestScoreElement.textContent = bestScore;
                }
            }
        } catch (e) {}

        // 初始化游戏
        function initGame() {
            // 初始化蛇
            snake = [
                {x: 5, y: 10},
                {x: 4, y: 10},
                {x: 3, y: 10}
            ];

            // 生成初始食物
            generateFood();

            // 重置方向和分数
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameSpeed = 150;
            updateScore();
        }

        // 生成食物
        function generateFood() {
            // 生成随机位置
            food = {
                x: Math.floor(Math.random() * gridWidth),
                y: Math.floor(Math.random() * gridHeight)
            };

            // 确保食物不在蛇身上
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }

        // 更新分数
        function updateScore() {
            const scoreEl = document.getElementById('scoreValue');
            if (scoreEl) {
                scoreEl.textContent = score;
            }
            if (score > bestScore) {
                bestScore = score;
                if (bestScoreElement) {
                    bestScoreElement.textContent = bestScore;
                }
                try {
                    localStorage.setItem('snake_best_score', String(bestScore));
                } catch (e) {}
            }
        }

        // 画网格
        function drawGrid() {
            ctx.strokeStyle = 'rgba(30, 64, 175, 0.4)';
            ctx.lineWidth = 0.5;

            // 画垂直线
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 画水平线
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 画蛇
        function drawSnake() {
            // 画蛇头
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize, gridSize);

            // 画蛇身
            for (let i = 1; i < snake.length; i++) {
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);

                // 添加边框效果
                ctx.strokeStyle = '#15803d';
                ctx.strokeRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
            }
        }

        // 画食物
        function drawFood() {
            ctx.fillStyle = '#f97316';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

            // 添加边框效果
            ctx.strokeStyle = '#ea580c';
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // 移动蛇
        function moveSnake() {
            // 更新方向
            direction = nextDirection;

            // 计算新头位置
            const head = {x: snake[0].x, y: snake[0].y};

            switch(direction) {
                case 'up':
                    head.y -= 1;
                    break;
                case 'down':
                    head.y += 1;
                    break;
                case 'left':
                    head.x -= 1;
                    break;
                case 'right':
                    head.x += 1;
                    break;
            }

            // 检查边界碰撞
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                resetGame();
                return;
            }

            // 检查自身碰撞
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    resetGame();
                    return;
                }
            }

            // 添加新头
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                updateScore();

                // 生成新食物
                generateFood();

                // 检查成就
                onEatFood();

                // 增加游戏速度（但不超过最小值50ms）
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                }
            } else {
                // 移除尾部
                snake.pop();
            }
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画网格
            drawGrid();

            // 画蛇和食物
            drawSnake();
            drawFood();

            // 如果游戏未开始或暂停，显示相应提示
            if (!gameStarted) {
                drawStartScreen();
            } else if (gamePaused) {
                drawPauseScreen();
            }
        }

        // 画开始屏幕
        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '20px Arial';
            ctx.fillStyle = '#e5e7eb';
            ctx.textAlign = 'center';
            ctx.fillText('按空格键开始游戏', canvas.width / 2, canvas.height / 2);
        }

        // 画暂停屏幕
        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '20px Arial';
            ctx.fillStyle = '#e5e7eb';
            ctx.textAlign = 'center';
            ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2);
        }

        // 游戏循环
        function gameStep() {
            if (gameStarted && !gamePaused) {
                moveSnake();
            }

            drawGame();

            // 使用setTimeout来控制游戏速度
            setTimeout(() => {
                requestAnimationFrame(gameStep);
            }, gameSpeed);
        }

        // 重置游戏
        function resetGame() {
            if (gameStarted) {
                onGameOver(); // 记录游戏结束
            }
            initGame();
            gameStarted = false;
            gamePaused = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
                gameLoop = null;
            }
            drawGame();
            if (btnStartPause) {
                btnStartPause.textContent = '开始 / 暂停';
            }
        }

        function setDirection(dir) {
            if (dir === 'up' && direction !== 'down') {
                nextDirection = 'up';
            } else if (dir === 'down' && direction !== 'up') {
                nextDirection = 'down';
            } else if (dir === 'left' && direction !== 'right') {
                nextDirection = 'left';
            } else if (dir === 'right' && direction !== 'left') {
                nextDirection = 'right';
            }
        }

        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
            }
            gamePaused = false;
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
            gameLoop = requestAnimationFrame(gameStep);
            if (btnStartPause) {
                btnStartPause.textContent = '暂停';
            }
        }

        function togglePause() {
            if (!gameStarted) {
                startGame();
                return;
            }
            gamePaused = !gamePaused;
            if (btnStartPause) {
                btnStartPause.textContent = gamePaused ? '继续' : '暂停';
            }
        }

        if (directionButtons && directionButtons.length) {
            directionButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const dir = btn.getAttribute('data-dir');
                    if (dir) {
                        setDirection(dir);
                        if (!gameStarted) {
                            startGame();
                        }
                    }
                });
            });
        }

        if (btnStartPause) {
            btnStartPause.addEventListener('click', () => {
                if (!gameStarted || gamePaused) {
                    startGame();
                } else {
                    togglePause();
                }
            });
        }

        if (btnRestart) {
            btnRestart.addEventListener('click', () => {
                resetGame();
            });
        }

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            if (touchStartX === null || touchStartY === null) {
                return;
            }
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            touchStartX = null;
            touchStartY = null;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            if (Math.max(absDx, absDy) < 10) {
                return;
            }

            if (absDx > absDy) {
                if (dx > 0) {
                    setDirection('right');
                } else {
                    setDirection('left');
                }
            } else {
                if (dy > 0) {
                    setDirection('down');
                } else {
                    setDirection('up');
                }
            }
            if (!gameStarted) {
                startGame();
            }
        });

        // 键盘事件处理
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case ' ':
                    if (!gameStarted || gamePaused) {
                        startGame();
                    } else {
                        togglePause();
                    }
                    break;
                case 'ArrowUp':
                    setDirection('up');
                    break;
                case 'ArrowDown':
                    setDirection('down');
                    break;
                case 'ArrowLeft':
                    setDirection('left');
                    break;
                case 'ArrowRight':
                    setDirection('right');
                    break;
            }
        });
        
        // 初始化游戏
        initGame();
        
        // 初始绘制
        drawGame();
    </script>
