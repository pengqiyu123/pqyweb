<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疯狂动物城互动圣诞树</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            z-index: 100;
            opacity: 1;
            border: 2px solid rgba(0, 255, 204, 0.5);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #output-canvas {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            transition: opacity 0.5s;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            user-select: none;
            font-size: 16px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        #photo-strip {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            overflow-x: auto;
            z-index: 50;
        }

        #photo-strip img {
            height: 100px;
            width: auto;
            border: 2px solid rgba(0, 255, 204, 0.5);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="loading">正在启动疯狂动物城传送门...<br><span style="font-size:16px; opacity:0.7">请允许摄像头权限</span></div>
    <div id="instructions">左手：握拳=圣诞树🎄 张开=飘散✨ | 右手：握拳=选中正面照片📷 张开=放回</div>
    <div id="photo-strip"></div>
    <div id="video-container">
        <video id="input_video"></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        console.log('Script starting...');

        const photoPaths = [
            'images/zootopia_batch/10001.jpg',
            'images/zootopia_batch/10002.jpg',
            'images/zootopia_batch/10003.jpg',
            'images/zootopia_batch/10004.jpg',
            'images/zootopia_batch/10005.jpg',
            'images/zootopia_batch/10006.jpg',
            'images/zootopia_batch/10007.jpg',
            'images/zootopia_batch/10008.jpg',
            'images/zootopia_batch/10009.jpg',
            'images/zootopia_batch/10010.jpg',
            'images/zootopia_batch/10011.jpg',
            'images/zootopia_batch/【哲风壁纸】4K-动漫-动物拟人.png'
        ];

        const photoStrip = document.getElementById('photo-strip');
        photoPaths.forEach((path, index) => {
            const img = document.createElement('img');
            img.src = path;
            img.title = `Photo ${index + 1}`;
            img.onerror = () => console.error('❌ Failed:', path);
            img.onload = () => console.log('✅ Loaded:', path);
            photoStrip.appendChild(img);
        });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;
        camera.position.y = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffcc00, 1, 100);
        pointLight.position.set(0, 20, 10);
        scene.add(pointLight);

        const PARTICLE_COUNT = 3000;
        const TREE_HEIGHT = 40;
        const TREE_RADIUS = 15;

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createParticleTexture();
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const targetPositionsTree = [];
        const targetPositionsDispersed = [];

        const colorPalette = [
            new THREE.Color(0x0d5e1a),
            new THREE.Color(0x166b2a),
            new THREE.Color(0x228b22),
            new THREE.Color(0xff0000),
            new THREE.Color(0xffd700),
            new THREE.Color(0xffffff)
        ];

        // Smooth cone tree - no layers
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const x = (Math.random() - 0.5) * 100;
            const y = (Math.random() - 0.5) * 100;
            const z = (Math.random() - 0.5) * 100;
            positions.push(x, y, z);
            targetPositionsDispersed.push(x, y, z);

            // Smooth cone shape
            const t = Math.random(); // 0=bottom, 1=top
            const h = t * TREE_HEIGHT - TREE_HEIGHT / 2;
            const radiusAtHeight = (1 - t) * TREE_RADIUS;
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * radiusAtHeight; // sqrt for uniform distribution

            targetPositionsTree.push(
                Math.cos(angle) * r,
                h,
                Math.sin(angle) * r
            );

            let color;
            const rand = Math.random();
            if (rand < 0.7) {
                color = colorPalette[Math.floor(Math.random() * 3)]; // Greens
            } else if (rand < 0.85) {
                color = colorPalette[3 + Math.floor(Math.random() * 2)]; // Red/Gold
            } else {
                color = colorPalette[5]; // White lights
            }
            colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Create 5-pointed star with particles
        const starGroup = new THREE.Group();
        const starParticleCount = 200;
        const starPositions = [];
        const starColors = [];
        const outerRadius = 3;
        const innerRadius = 1.2;

        // Create star shape with particles
        for (let i = 0; i < starParticleCount; i++) {
            const pointIndex = i % 10;
            const isOuter = pointIndex % 2 === 0;
            const angle = (Math.floor(pointIndex / 2) * Math.PI * 2) / 5 - Math.PI / 2;
            const actualAngle = isOuter ? angle : angle + Math.PI / 5;
            const radius = isOuter ? outerRadius : innerRadius;

            // Add some randomness to fill the star
            const randomOffset = Math.random() * 0.5;
            const randomAngle = actualAngle + (Math.random() - 0.5) * 0.3;
            const r = radius * (0.3 + Math.random() * 0.7);

            starPositions.push(
                Math.cos(randomAngle) * r,
                Math.sin(randomAngle) * r,
                (Math.random() - 0.5) * 0.3
            );

            // Golden yellow color
            starColors.push(1, 0.9, 0);
        }

        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

        const starMaterial = new THREE.PointsMaterial({
            size: 0.6,
            vertexColors: true,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 1
        });

        const star = new THREE.Points(starGeometry, starMaterial);
        star.position.set(0, TREE_HEIGHT / 2 + 3, 0);
        scene.add(star);

        const starLight = new THREE.PointLight(0xffff00, 1, 20);
        starLight.position.set(0, TREE_HEIGHT / 2 + 3, 0);
        scene.add(starLight);

        const textureLoader = new THREE.TextureLoader();
        const photoGroup = new THREE.Group();
        const photoSprites = [];

        photoPaths.forEach((path, i) => {
            const texture = textureLoader.load(path);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));

            // Tree position: tilted on tree like ornaments
            const t = (i + 1) / (photoPaths.length + 1);
            const h = t * (TREE_HEIGHT - 8) - TREE_HEIGHT / 2 + 4;
            const radiusAtHeight = (1 - t) * (TREE_RADIUS - 2);
            const angle = (i / photoPaths.length) * Math.PI * 2;

            const treePos = new THREE.Vector3(
                Math.cos(angle) * radiusAtHeight,
                h,
                Math.sin(angle) * radiusAtHeight
            );

            // Dispersed position: scattered randomly
            const dispersedPos = new THREE.Vector3(
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60
            );

            sprite.position.copy(dispersedPos);
            sprite.scale.set(6, 6, 1);

            sprite.userData = {
                treePos: treePos,
                dispersedPos: dispersedPos,
                originalScale: new THREE.Vector3(6, 6, 1),
                isSelected: false,
                index: i
            };

            photoGroup.add(sprite);
            photoSprites.push(sprite);
        });

        scene.add(photoGroup);

        let mode = 'DISPERSED';
        let selectedPhoto = null;
        let rightFistPrev = false;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const positionsAttribute = geometry.attributes.position;
            const currentPositions = positionsAttribute.array;
            const target = mode === 'TREE' ? targetPositionsTree : targetPositionsDispersed;
            const speed = 0.05;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                currentPositions[ix] += (target[ix] - currentPositions[ix]) * speed;
                currentPositions[ix + 1] += (target[ix + 1] - currentPositions[ix + 1]) * speed;
                currentPositions[ix + 2] += (target[ix + 2] - currentPositions[ix + 2]) * speed;
            }
            positionsAttribute.needsUpdate = true;

            // Update photo positions
            photoSprites.forEach(sprite => {
                if (sprite.userData.isSelected) {
                    // Selected photo moves to camera front
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    const zoomPos = camera.position.clone().add(camDir.multiplyScalar(20));
                    sprite.position.lerp(zoomPos, 0.1);
                    sprite.scale.lerp(new THREE.Vector3(18, 18, 1), 0.1);
                } else {
                    // Move to tree or dispersed position
                    const targetPos = mode === 'TREE' ? sprite.userData.treePos : sprite.userData.dispersedPos;
                    sprite.position.lerp(targetPos, speed);
                    sprite.scale.lerp(sprite.userData.originalScale, 0.1);
                }
            });

            // Star always rotates
            star.rotation.y += 0.02;

            // Both particles and photos always rotate together
            particles.rotation.y += 0.002;
            photoGroup.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        animate();

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [0, 9], [9, 10], [10, 11], [11, 12],
            [0, 13], [13, 14], [14, 15], [15, 16],
            [0, 17], [17, 18], [18, 19], [19, 20],
            [5, 9], [9, 13], [13, 17]
        ];

        hands.onResults((results) => {
            document.getElementById('loading').style.opacity = 0;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const hand = results.multiHandLandmarks[i];
                    const label = results.multiHandedness[i].label;
                    const color = label === 'Left' ? '#00ffff' : '#ff00ff';

                    canvasCtx.strokeStyle = color;
                    canvasCtx.lineWidth = 2;
                    HAND_CONNECTIONS.forEach(([start, end]) => {
                        const startPoint = hand[start];
                        const endPoint = hand[end];
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(startPoint.x * canvasElement.width, startPoint.y * canvasElement.height);
                        canvasCtx.lineTo(endPoint.x * canvasElement.width, endPoint.y * canvasElement.height);
                        canvasCtx.stroke();
                    });

                    canvasCtx.fillStyle = color;
                    hand.forEach((landmark) => {
                        canvasCtx.beginPath();
                        canvasCtx.arc(
                            landmark.x * canvasElement.width,
                            landmark.y * canvasElement.height,
                            3, 0, 2 * Math.PI
                        );
                        canvasCtx.fill();
                    });

                    canvasCtx.font = 'bold 16px Arial';
                    canvasCtx.fillText(
                        label === 'Left' ? '左手' : '右手',
                        hand[0].x * canvasElement.width,
                        hand[0].y * canvasElement.height - 10
                    );

                    const wrist = hand[0];
                    const indexTip = hand[8];
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - wrist.x, 2) +
                        Math.pow(indexTip.y - wrist.y, 2)
                    );
                    const isFist = distance < 0.15;

                    if (label === 'Left') {
                        // Left hand: control tree/dispersed
                        mode = isFist ? 'TREE' : 'DISPERSED';
                    } else if (label === 'Right') {
                        // Right hand: fist to select front photo, open to release
                        if (isFist && !rightFistPrev) {
                            // Find photo closest to front (facing camera)
                            let frontPhoto = null;
                            let maxZ = -Infinity;

                            photoSprites.forEach(sprite => {
                                if (!sprite.userData.isSelected) {
                                    const worldPos = new THREE.Vector3();
                                    sprite.getWorldPosition(worldPos);
                                    if (worldPos.z > maxZ) {
                                        maxZ = worldPos.z;
                                        frontPhoto = sprite;
                                    }
                                }
                            });

                            if (frontPhoto && !selectedPhoto) {
                                frontPhoto.userData.isSelected = true;
                                selectedPhoto = frontPhoto;
                            }
                        } else if (!isFist && selectedPhoto) {
                            // Open hand: release photo
                            selectedPhoto.userData.isSelected = false;
                            selectedPhoto = null;
                        }
                        rightFistPrev = isFist;
                    }
                }
            }

            canvasCtx.restore();
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        canvasElement.width = 640;
        canvasElement.height = 480;
        cameraUtils.start();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
