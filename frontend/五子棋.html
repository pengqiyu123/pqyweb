<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6em;
            margin-bottom: 6px;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .achieve-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .game-area {
            padding: 16px;
        }

        /* 模式选择 */
        .mode-select {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.pvp {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .mode-btn.ai {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        /* AI难度选择 */
        .difficulty-select {
            display: none;
            gap: 8px;
            margin-bottom: 16px;
        }

        .difficulty-select.show {
            display: flex;
        }

        .diff-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .diff-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff, #e8f4fd);
            color: #667eea;
        }

        /* 游戏状态 */
        .game-status {
            text-align: center;
            padding: 12px;
            background: linear-gradient(135deg, #f0f4ff, #e8f4fd);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 2px solid #c7d2fe;
        }

        .status-text {
            font-size: 1em;
            font-weight: 700;
            color: #4f46e5;
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            margin-top: 8px;
        }

        .player-score {
            text-align: center;
        }

        .player-score .name {
            font-size: 0.8em;
            color: #6b7280;
        }

        .player-score .score {
            font-size: 1.3em;
            font-weight: 700;
        }

        .player-score.black .score { color: #1f2937; }
        .player-score.white .score { color: #6b7280; }

        /* 棋盘 */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 16px;
        }

        .board {
            display: grid;
            background: linear-gradient(135deg, #deb887, #d2a679);
            border-radius: 8px;
            padding: 8px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        .cell {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
        }

        .cell::before,
        .cell::after {
            content: '';
            position: absolute;
            background: #8b7355;
        }

        .cell::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .cell::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        .cell:first-child::before { left: 50%; width: 50%; }
        .cell:nth-child(15n)::before { width: 50%; }
        .cell:nth-child(-n+15)::after { top: 50%; height: 50%; }
        .cell:nth-last-child(-n+15)::after { height: 50%; }

        .stone {
            position: absolute;
            width: 85%;
            height: 85%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 2;
            transition: all 0.15s;
        }

        .stone.black {
            background: radial-gradient(circle at 30% 30%, #4a4a4a, #1a1a1a);
            box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .stone.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stone.win {
            animation: pulse 0.4s ease infinite alternate;
        }

        .stone.last {
            box-shadow: 0 0 0 3px #ff6b6b;
        }

        .stone.preview {
            opacity: 0.5;
            animation: preview-pulse 0.8s ease infinite;
        }

        @keyframes preview-pulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes pulse {
            to { transform: translate(-50%, -50%) scale(1.1); }
        }

        .cell:hover::before {
            background: rgba(102, 126, 234, 0.3);
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-undo {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        /* 成就弹窗 */
        .achievement-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .achievement-modal.show {
            display: flex;
        }

        .achievement-content {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
        }

        .achievement-header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-header h2 {
            margin: 0;
            font-size: 1.2em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #1f2937;
        }

        .achievement-list {
            padding: 16px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
        }

        .achievement-item.unlocked {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: #22c55e;
        }

        .achievement-item.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 1.8em;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-name {
            font-weight: 700;
            color: #1f2937;
        }

        .achievement-desc {
            font-size: 0.85em;
            color: #6b7280;
        }

        .achievement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.5);
            z-index: 2000;
            animation: toastIn 0.3s ease;
            font-weight: 600;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* 游戏结果弹窗 */
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 900;
            justify-content: center;
            align-items: center;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 300px;
        }

        .result-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .result-buttons {
            display: flex;
            gap: 10px;
        }

        .result-buttons .btn {
            flex: 1;
        }

        @media (max-width: 400px) {
            .board {
                padding: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚫⚪ 五子棋</h1>
            <p>五子连珠获胜</p>
            <div class="header-actions">
                <button class="achieve-btn" onclick="showAchievements()">🏆 成就</button>
            </div>
        </div>

        <div class="game-area">
            <!-- 模式选择 -->
            <div class="mode-select" id="modeSelect">
                <button class="mode-btn pvp" onclick="startGame('pvp')">👥 本地双人对战</button>
                <button class="mode-btn ai" onclick="showDifficulty()">🤖 AI 对战</button>
            </div>

            <!-- AI难度选择 -->
            <div class="difficulty-select" id="difficultySelect">
                <button class="diff-btn" onclick="startGame('ai', 0)">简单</button>
                <button class="diff-btn active" onclick="startGame('ai', 1)">中等</button>
                <button class="diff-btn" onclick="startGame('ai', 2)">困难</button>
            </div>

            <!-- 游戏状态 -->
            <div class="game-status" id="gameStatus" style="display: none;">
                <div class="status-text" id="statusText">黑棋先手</div>
                <div class="score-display">
                    <div class="player-score black">
                        <div class="name" id="player1Name">玩家1 (黑)</div>
                        <div class="score" id="score1">0</div>
                    </div>
                    <div class="player-score white">
                        <div class="name" id="player2Name">玩家2 (白)</div>
                        <div class="score" id="score2">0</div>
                    </div>
                </div>
            </div>

            <!-- 棋盘 -->
            <div class="board-container">
                <div class="board" id="board" style="display: none;"></div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls" id="controls" style="display: none;">
                <button class="btn btn-undo" onclick="undoMove()">↩️ 悔棋</button>
                <button class="btn btn-primary" onclick="resetGame()">🔄 再来</button>
                <button class="btn btn-secondary" onclick="backToMenu()">🏠 菜单</button>
            </div>
        </div>
    </div>

    <!-- 游戏结果弹窗 -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">游戏结束</div>
            <div class="result-buttons">
                <button class="btn btn-secondary" onclick="backToMenu()">菜单</button>
                <button class="btn btn-primary" onclick="resetGame()">再来</button>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-modal" id="achievementModal">
        <div class="achievement-content">
            <div class="achievement-header">
                <h2>🏆 游戏成就</h2>
                <button class="close-btn" onclick="closeAchievements()">×</button>
            </div>
            <div class="achievement-list" id="achievementList"></div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        
        // 成就定义
        const achievements = [
            { id: 'first_win', name: '初出茅庐', desc: '赢得第一场胜利', icon: '🏆' },
            { id: 'win_5', name: '棋艺初成', desc: '累计获胜5次', icon: '🔥' },
            { id: 'win_20', name: '弈林高手', desc: '累计获胜20次', icon: '⚡' },
            { id: 'beat_ai_easy', name: 'AI新手', desc: '击败简单AI', icon: '🤖' },
            { id: 'beat_ai_medium', name: 'AI挑战者', desc: '击败中等AI', icon: '🎯' },
            { id: 'beat_ai_hard', name: 'AI终结者', desc: '击败困难AI', icon: '👑' },
            { id: 'quick_win', name: '速战速决', desc: '20步内获胜', icon: '💨' },
            { id: 'pvp_10', name: '对弈达人', desc: '进行10场双人对战', icon: '🤝' },
            { id: 'streak_5', name: '五连胜', desc: '连续获胜5场', icon: '🌟' },
            { id: 'games_50', name: '资深棋手', desc: '游玩50局游戏', icon: '🎮' }
        ];

        // 游戏状态
        let board = [];
        let currentPlayer = 1; // 1=黑, 2=白
        let gameMode = '';
        let aiDifficulty = 1;
        let gameOver = false;
        let moveCount = 0;
        let lastMove = null;
        let history = [];
        let scores = { 1: 0, 2: 0 };
        let previewCell = null; // 预览位置
        
        // 统计数据
        let gameData = {
            unlocked: [],
            totalWins: 0,
            totalGames: 0,
            pvpGames: 0,
            currentStreak: 0,
            aiWins: { 0: 0, 1: 0, 2: 0 }
        };

        function init() {
            loadGameData();
        }

        function loadGameData() {
            try {
                const saved = localStorage.getItem('gomoku_data');
                if (saved) gameData = JSON.parse(saved);
            } catch(e) {}
        }

        function saveGameData() {
            try {
                localStorage.setItem('gomoku_data', JSON.stringify(gameData));
            } catch(e) {}
        }

        function showDifficulty() {
            document.getElementById('difficultySelect').classList.add('show');
        }

        function startGame(mode, difficulty = 1) {
            gameMode = mode;
            aiDifficulty = difficulty;
            
            document.getElementById('modeSelect').style.display = 'none';
            document.getElementById('difficultySelect').classList.remove('show');
            document.getElementById('gameStatus').style.display = 'block';
            document.getElementById('board').style.display = 'grid';
            document.getElementById('controls').style.display = 'flex';

            if (mode === 'pvp') {
                document.getElementById('player1Name').textContent = '玩家1 (黑)';
                document.getElementById('player2Name').textContent = '玩家2 (白)';
            } else {
                document.getElementById('player1Name').textContent = '你 (黑)';
                document.getElementById('player2Name').textContent = 'AI (白)';
            }

            initBoard();
            resetGame();
        }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';
            
            for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }

        function resetGame() {
            board = Array(BOARD_SIZE * BOARD_SIZE).fill(0);
            currentPlayer = 1;
            gameOver = false;
            moveCount = 0;
            lastMove = null;
            history = [];
            previewCell = null;
            document.getElementById('resultModal').classList.remove('show');
            updateStatus();
            renderBoard();
        }

        function backToMenu() {
            document.getElementById('modeSelect').style.display = 'flex';
            document.getElementById('difficultySelect').classList.remove('show');
            document.getElementById('gameStatus').style.display = 'none';
            document.getElementById('board').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('resultModal').classList.remove('show');
            scores = { 1: 0, 2: 0 };
            updateScores();
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerHTML = '';
                cell.onclick = () => handleCellClick(i);
                
                if (board[i]) {
                    const stone = document.createElement('div');
                    stone.className = `stone ${board[i] === 1 ? 'black' : 'white'}`;
                    if (i === lastMove) stone.classList.add('last');
                    cell.appendChild(stone);
                } else if (i === previewCell) {
                    // 显示预览棋子
                    const stone = document.createElement('div');
                    stone.className = `stone ${currentPlayer === 1 ? 'black' : 'white'} preview`;
                    cell.appendChild(stone);
                }
            });
        }

        function handleCellClick(index) {
            if (gameOver) return;
            if (gameMode === 'ai' && currentPlayer === 2) return;
            if (board[index]) return;
            
            if (previewCell === index) {
                // 点击预览位置，确认落子
                previewCell = null;
                makeMove(index);
            } else {
                // 显示新的预览位置
                previewCell = index;
                renderBoard();
            }
        }

        function makeMove(index) {
            history.push({ index, player: currentPlayer, board: [...board] });
            board[index] = currentPlayer;
            lastMove = index;
            moveCount++;
            renderBoard();

            const winLine = checkWinner(index);
            if (winLine) {
                endGame(currentPlayer, winLine);
                return;
            }

            if (moveCount >= BOARD_SIZE * BOARD_SIZE) {
                endGame('draw');
                return;
            }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateStatus();

            if (gameMode === 'ai' && currentPlayer === 2) {
                setTimeout(aiMove, 300);
            }
        }

        function undoMove() {
            if (history.length === 0 || gameOver) return;
            
            // AI模式撤销两步
            const steps = gameMode === 'ai' ? Math.min(2, history.length) : 1;
            for (let i = 0; i < steps; i++) {
                const last = history.pop();
                if (last) {
                    board[last.index] = 0;
                    moveCount--;
                }
            }
            
            lastMove = history.length > 0 ? history[history.length - 1].index : null;
            currentPlayer = 1;
            renderBoard();
            updateStatus();
        }

        function aiMove() {
            if (gameOver) return;

            let move;
            if (aiDifficulty === 0) {
                move = getRandomMove();
            } else if (aiDifficulty === 1) {
                move = Math.random() > 0.2 ? getSmartMove() : getRandomMove();
            } else {
                move = getSmartMove();
            }

            if (move !== -1) {
                history.push({ index: move, player: 2, board: [...board] });
                board[move] = 2;
                lastMove = move;
                moveCount++;
                renderBoard();

                const winLine = checkWinner(move);
                if (winLine) {
                    endGame(2, winLine);
                    return;
                }

                currentPlayer = 1;
                updateStatus();
            }
        }

        function getRandomMove() {
            const empty = board.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1);
            return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
        }

        function getSmartMove() {
            // 简单AI: 优先进攻/防守
            let bestScore = -Infinity;
            let bestMove = -1;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === 0) {
                    // 评估AI进攻
                    board[i] = 2;
                    let attackScore = evaluatePosition(i, 2);
                    board[i] = 0;

                    // 评估防守
                    board[i] = 1;
                    let defendScore = evaluatePosition(i, 1);
                    board[i] = 0;

                    let score = Math.max(attackScore * 1.1, defendScore);
                    
                    // 中心优势
                    const row = Math.floor(i / BOARD_SIZE);
                    const col = i % BOARD_SIZE;
                    const centerDist = Math.abs(row - 7) + Math.abs(col - 7);
                    score += (14 - centerDist) * 0.5;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function evaluatePosition(index, player) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            let score = 0;

            for (const [dx, dy] of directions) {
                let count = 1;
                let openEnds = 0;

                // 正向
                let r = Math.floor(index / BOARD_SIZE) + dy;
                let c = index % BOARD_SIZE + dx;
                while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                    if (board[r * BOARD_SIZE + c] === player) count++;
                    else {
                        if (board[r * BOARD_SIZE + c] === 0) openEnds++;
                        break;
                    }
                    r += dy;
                    c += dx;
                }

                // 反向
                r = Math.floor(index / BOARD_SIZE) - dy;
                c = index % BOARD_SIZE - dx;
                while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                    if (board[r * BOARD_SIZE + c] === player) count++;
                    else {
                        if (board[r * BOARD_SIZE + c] === 0) openEnds++;
                        break;
                    }
                    r -= dy;
                    c -= dx;
                }

                if (count >= 5) score += 100000;
                else if (count === 4 && openEnds >= 1) score += 10000;
                else if (count === 3 && openEnds === 2) score += 1000;
                else if (count === 3 && openEnds === 1) score += 100;
                else if (count === 2 && openEnds === 2) score += 50;
            }
            return score;
        }

        function checkWinner(index) {
            const player = board[index];
            const row = Math.floor(index / BOARD_SIZE);
            const col = index % BOARD_SIZE;
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of directions) {
                let count = 1;
                let line = [index];

                // 正向检查
                let r = row + dy, c = col + dx;
                while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r * BOARD_SIZE + c] === player) {
                    line.push(r * BOARD_SIZE + c);
                    count++;
                    r += dy;
                    c += dx;
                }

                // 反向检查
                r = row - dy;
                c = col - dx;
                while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r * BOARD_SIZE + c] === player) {
                    line.push(r * BOARD_SIZE + c);
                    count++;
                    r -= dy;
                    c -= dx;
                }

                if (count >= 5) return line;
            }
            return null;
        }

        function highlightWin(line) {
            line.forEach(i => {
                const cell = document.querySelectorAll('.cell')[i];
                const stone = cell.querySelector('.stone');
                if (stone) stone.classList.add('win');
            });
        }

        function endGame(result, winLine = null) {
            gameOver = true;
            gameData.totalGames++;
            if (gameMode === 'pvp') gameData.pvpGames++;

            if (winLine) highlightWin(winLine);

            let icon, title;
            if (result === 'draw') {
                icon = '🤝';
                title = '平局！';
                gameData.currentStreak = 0;
            } else if (result === 1) {
                scores[1]++;
                if (gameMode === 'pvp') {
                    icon = '🎉';
                    title = '玩家1 (黑) 获胜！';
                } else {
                    icon = '🎉';
                    title = '你赢了！';
                    gameData.totalWins++;
                    gameData.currentStreak++;
                    gameData.aiWins[aiDifficulty]++;
                    
                    if (moveCount <= 20) unlockAchievement('quick_win');
                    if (aiDifficulty === 0) unlockAchievement('beat_ai_easy');
                    if (aiDifficulty === 1) unlockAchievement('beat_ai_medium');
                    if (aiDifficulty === 2) unlockAchievement('beat_ai_hard');
                }
                unlockAchievement('first_win');
            } else {
                scores[2]++;
                if (gameMode === 'pvp') {
                    icon = '🎉';
                    title = '玩家2 (白) 获胜！';
                } else {
                    icon = '😢';
                    title = 'AI 获胜';
                    gameData.currentStreak = 0;
                }
            }

            // 检查成就
            if (gameData.totalWins >= 5) unlockAchievement('win_5');
            if (gameData.totalWins >= 20) unlockAchievement('win_20');
            if (gameData.pvpGames >= 10) unlockAchievement('pvp_10');
            if (gameData.currentStreak >= 5) unlockAchievement('streak_5');
            if (gameData.totalGames >= 50) unlockAchievement('games_50');

            saveGameData();
            updateScores();

            setTimeout(() => {
                document.getElementById('resultIcon').textContent = icon;
                document.getElementById('resultTitle').textContent = title;
                document.getElementById('resultModal').classList.add('show');
            }, 500);
        }

        function updateStatus() {
            const text = gameMode === 'ai' 
                ? (currentPlayer === 1 ? '轮到你了 (黑棋)' : 'AI 思考中...')
                : `轮到 ${currentPlayer === 1 ? '玩家1 (黑)' : '玩家2 (白)'}`;
            document.getElementById('statusText').textContent = text;
        }

        function updateScores() {
            document.getElementById('score1').textContent = scores[1];
            document.getElementById('score2').textContent = scores[2];
        }

        // 成就系统
        function unlockAchievement(id) {
            if (gameData.unlocked.includes(id)) return;
            gameData.unlocked.push(id);
            saveGameData();
            const ach = achievements.find(a => a.id === id);
            if (ach) showAchievementToast(ach);
        }

        function showAchievementToast(ach) {
            const toast = document.createElement('div');
            toast.className = 'achievement-toast';
            toast.innerHTML = `${ach.icon} 成就解锁：${ach.name}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showAchievements() {
            renderAchievementList();
            document.getElementById('achievementModal').classList.add('show');
        }

        function closeAchievements() {
            document.getElementById('achievementModal').classList.remove('show');
        }

        function renderAchievementList() {
            const list = document.getElementById('achievementList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = gameData.unlocked.includes(ach.id);
                return `
                    <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${ach.name}</div>
                            <div class="achievement-desc">${ach.desc}</div>
                        </div>
                        ${unlocked ? '<span style="color:#22c55e">✓</span>' : '<span style="color:#9ca3af">🔒</span>'}
                    </div>
                `;
            }).join('');
        }

        init();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>
</html>
