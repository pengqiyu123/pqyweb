<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>迷宫逃脱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.3em;
            margin-bottom: 2px;
        }

        .header p {
            font-size: 0.75em;
            opacity: 0.8;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            color: white;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7em;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 1em;
            font-weight: 700;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            background: #0a0a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 8px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 难度选择 */
        .difficulty-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.3);
        }

        /* 拖动提示 */
        .drag-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-wrapper:active .drag-hint {
            opacity: 1;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: white;
            max-width: 320px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .modal-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        /* 成就 */
        .achieve-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .achievement-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .achievement-modal.show {
            display: flex;
        }

        .achievement-content {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
        }

        .achievement-header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achievement-header h2 {
            margin: 0;
            font-size: 1.2em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #1f2937;
        }

        .achievement-list {
            padding: 16px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: #f3f4f6;
        }

        .achievement-item.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 2em;
        }

        .achievement-info h3 {
            font-size: 1em;
            color: #1f2937;
            margin-bottom: 2px;
        }

        .achievement-info p {
            font-size: 0.85em;
            color: #6b7280;
        }

        .achievement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 2000;
            animation: toast-in 0.3s ease, toast-out 0.3s ease 2.5s forwards;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes toast-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .tip {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.8em;
            margin-top: 8px;
        }

        @media (max-width: 400px) {
            .dpad-btn {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏃 迷宫逃脱</h1>
            <p>从起点走到终点，用最短时间逃出迷宫</p>
            <button class="achieve-btn" onclick="showAchievements()">🏆 成就</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="steps">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="time">0:00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">最高关</div>
                <div class="stat-value" id="maxLevel">1</div>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="nextLevel()">▶️ 开始</button>
            <button class="btn btn-secondary" onclick="showLevelSelect()">📋 选关</button>
            <button class="btn btn-secondary" onclick="showSolution()">💡 提示</button>
        </div>

        <div class="tip">电脑：方向键或WASD移动 | 手机：拖动笑脸移动</div>
    </div>

    <!-- 胜利弹窗 -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <div class="modal-title" id="modalTitle">恭喜逃脱！</div>
            <div class="modal-subtitle" id="modalSubtitle">用时: 0:00</div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="nextLevel()">下一关</button>
                <button class="btn btn-secondary" onclick="replayLevel()">重玩</button>
            </div>
        </div>
    </div>

    <!-- 关卡选择弹窗 -->
    <div class="modal" id="levelModal">
        <div class="modal-content" style="max-width: 340px;">
            <div class="modal-title">📋 选择关卡</div>
            <div id="levelGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0;"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeLevelSelect()">取消</button>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-modal" id="achievementModal">
        <div class="achievement-content">
            <div class="achievement-header">
                <h2>🏆 游戏成就</h2>
                <button class="close-btn" onclick="closeAchievements()">×</button>
            </div>
            <div class="achievement-list" id="achievementList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 关卡配置 (20关)
        const LEVELS = [
            { size: 7,  name: '新手村' },
            { size: 9,  name: '小径' },
            { size: 11, name: '花园' },
            { size: 11, name: '迷径' },
            { size: 13, name: '森林' },
            { size: 13, name: '树林' },
            { size: 15, name: '古堡' },
            { size: 15, name: '城墙' },
            { size: 17, name: '地牢' },
            { size: 17, name: '暗道' },
            { size: 19, name: '迷城' },
            { size: 19, name: '废墟' },
            { size: 21, name: '深渊' },
            { size: 21, name: '炼狱' },
            { size: 23, name: '魔窟' },
            { size: 23, name: '幽冥' },
            { size: 25, name: '终焉' },
            { size: 27, name: '永夜' },
            { size: 29, name: '无尽' },
            { size: 31, name: '传说' }
        ];

        // 成就定义
        const achievements = [
            { id: 'first_win', name: '初次逃脱', desc: '完成第1关', icon: '🏆' },
            { id: 'level_5', name: '迷宫新手', desc: '通关第5关', icon: '⭐' },
            { id: 'level_10', name: '迷宫探索者', desc: '通关第10关', icon: '🗺️' },
            { id: 'level_15', name: '迷宫专家', desc: '通关第15关', icon: '🎯' },
            { id: 'level_20', name: '迷宫大师', desc: '通关第20关', icon: '👑' },
            { id: 'fast_clear', name: '闪电逃脱', desc: '20秒内通关任意关卡', icon: '⚡' },
            { id: 'no_hint', name: '独立思考', desc: '不使用提示通关', icon: '🧠' },
            { id: 'perfect', name: '完美路径', desc: '用最短路径通关', icon: '💎' },
            { id: 'streak_3', name: '三连胜', desc: '连续通关3关', icon: '🔥' },
            { id: 'streak_5', name: '五连胜', desc: '连续通关5关', icon: '💥' }
        ];

        // 游戏状态
        let gameData = {
            unlocked: [],
            maxLevel: 1,
            currentLevel: 1,
            streak: 0
        };

        let level = 1;
        let mazeSize = 7;
        let maze = [];
        let playerX = 1, playerY = 1;
        let endX, endY;
        let steps = 0;
        let startTime = 0;
        let timerInterval = null;
        let gameWon = false;
        let usedHint = false;
        let solutionPath = [];
        let showingSolution = false;

        // 画布尺寸
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const maxHeight = window.innerHeight - 380; // 给其他UI留空间
            const size = Math.min(wrapper.clientWidth, maxHeight, 400);
            canvas.width = size;
            canvas.height = size;
        }

        // 迷宫生成（深度优先搜索算法）
        function generateMaze() {
            maze = [];
            for (let y = 0; y < mazeSize; y++) {
                maze[y] = [];
                for (let x = 0; x < mazeSize; x++) {
                    maze[y][x] = 1; // 1 = 墙
                }
            }

            // DFS 生成迷宫
            function carve(x, y) {
                maze[y][x] = 0; // 0 = 通道

                const directions = [
                    [0, -2], [0, 2], [-2, 0], [2, 0]
                ];
                
                // 随机打乱方向
                for (let i = directions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [directions[i], directions[j]] = [directions[j], directions[i]];
                }

                for (const [dx, dy] of directions) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx > 0 && nx < mazeSize - 1 && ny > 0 && ny < mazeSize - 1 && maze[ny][nx] === 1) {
                        maze[y + dy/2][x + dx/2] = 0; // 打通中间墙
                        carve(nx, ny);
                    }
                }
            }

            carve(1, 1);

            // 设置起点和终点
            playerX = 1;
            playerY = 1;
            endX = mazeSize - 2;
            endY = mazeSize - 2;
            maze[endY][endX] = 0;

            // 计算最短路径
            calculateSolution();
        }

        // BFS 计算最短路径
        function calculateSolution() {
            const queue = [[playerX, playerY, []]];
            const visited = new Set();
            visited.add(`${playerX},${playerY}`);

            while (queue.length > 0) {
                const [x, y, path] = queue.shift();

                if (x === endX && y === endY) {
                    solutionPath = [...path, [x, y]];
                    return;
                }

                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                for (const [dx, dy] of dirs) {
                    const nx = x + dx;
                    const ny = y + dy;
                    const key = `${nx},${ny}`;
                    if (nx >= 0 && nx < mazeSize && ny >= 0 && ny < mazeSize && 
                        maze[ny][nx] === 0 && !visited.has(key)) {
                        visited.add(key);
                        queue.push([nx, ny, [...path, [x, y]]]);
                    }
                }
            }
            solutionPath = [];
        }

        // 绘制迷宫
        function draw() {
            const cellSize = canvas.width / mazeSize;

            // 清空画布
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制迷宫
            for (let y = 0; y < mazeSize; y++) {
                for (let x = 0; x < mazeSize; x++) {
                    if (maze[y][x] === 1) {
                        // 墙壁
                        ctx.fillStyle = '#2d3748';
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    } else {
                        // 通道
                        ctx.fillStyle = '#1a202c';
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }

            // 绘制提示路径
            if (showingSolution && solutionPath.length > 0) {
                ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
                for (const [px, py] of solutionPath) {
                    ctx.fillRect(px * cellSize + 2, py * cellSize + 2, cellSize - 4, cellSize - 4);
                }
            }

            // 绘制终点
            ctx.fillStyle = '#48bb78';
            const endPadding = cellSize * 0.15;
            ctx.beginPath();
            ctx.roundRect(endX * cellSize + endPadding, endY * cellSize + endPadding, 
                         cellSize - endPadding * 2, cellSize - endPadding * 2, cellSize * 0.2);
            ctx.fill();
            
            // 终点图标
            ctx.fillStyle = 'white';
            ctx.font = `${cellSize * 0.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚩', endX * cellSize + cellSize/2, endY * cellSize + cellSize/2);

            // 绘制玩家
            const playerGradient = ctx.createRadialGradient(
                playerX * cellSize + cellSize/2, playerY * cellSize + cellSize/2, 0,
                playerX * cellSize + cellSize/2, playerY * cellSize + cellSize/2, cellSize/2
            );
            playerGradient.addColorStop(0, '#fbbf24');
            playerGradient.addColorStop(1, '#f59e0b');
            ctx.fillStyle = playerGradient;
            const playerPadding = cellSize * 0.2;
            ctx.beginPath();
            ctx.arc(playerX * cellSize + cellSize/2, playerY * cellSize + cellSize/2, 
                   cellSize/2 - playerPadding, 0, Math.PI * 2);
            ctx.fill();

            // 玩家图标
            ctx.fillStyle = '#1f2937';
            ctx.font = `${cellSize * 0.4}px sans-serif`;
            ctx.fillText('😊', playerX * cellSize + cellSize/2, playerY * cellSize + cellSize/2);
        }

        // 移动玩家
        function move(dx, dy) {
            if (gameWon) return;

            const newX = playerX + dx;
            const newY = playerY + dy;

            if (newX >= 0 && newX < mazeSize && newY >= 0 && newY < mazeSize && maze[newY][newX] === 0) {
                playerX = newX;
                playerY = newY;
                steps++;
                document.getElementById('steps').textContent = steps;

                // 开始计时
                if (!timerInterval && steps === 1) {
                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 100);
                }

                draw();

                // 检查胜利
                if (playerX === endX && playerY === endY) {
                    win();
                }
            }
        }

        // 更新计时器
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            document.getElementById('time').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 胜利
        function win() {
            gameWon = true;
            clearInterval(timerInterval);
            timerInterval = null;

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;

            // 更新最高关卡
            if (level > gameData.maxLevel) {
                gameData.maxLevel = level;
                document.getElementById('maxLevel').textContent = gameData.maxLevel;
            }
            
            // 连胜
            gameData.streak++;

            // 检查成就
            unlockAchievement('first_win');
            if (level >= 5) unlockAchievement('level_5');
            if (level >= 10) unlockAchievement('level_10');
            if (level >= 15) unlockAchievement('level_15');
            if (level >= 20) unlockAchievement('level_20');
            if (elapsed <= 20) unlockAchievement('fast_clear');
            if (!usedHint) unlockAchievement('no_hint');
            if (steps === solutionPath.length - 1) unlockAchievement('perfect');
            if (gameData.streak >= 3) unlockAchievement('streak_3');
            if (gameData.streak >= 5) unlockAchievement('streak_5');

            saveGameData();

            // 显示胜利弹窗
            const levelInfo = LEVELS[level - 1];
            document.getElementById('modalTitle').textContent = `第${level}关 通过！`;
            document.getElementById('modalSubtitle').textContent = `${levelInfo.name} | 用时: ${timeStr} | 步数: ${steps}`;
            document.getElementById('winModal').classList.add('show');
        }

        // 下一关
        function nextLevel() {
            document.getElementById('winModal').classList.remove('show');
            if (gameWon && level < 20) {
                level++;
            }
            startLevel(level);
        }
        
        // 重玩当前关
        function replayLevel() {
            document.getElementById('winModal').classList.remove('show');
            gameData.streak = 0;
            startLevel(level);
        }
        
        // 开始指定关卡
        function startLevel(lv) {
            level = lv;
            mazeSize = LEVELS[level - 1].size;
            
            document.getElementById('level').textContent = level;
            document.getElementById('steps').textContent = '0';
            document.getElementById('time').textContent = '0:00';
            
            gameWon = false;
            usedHint = false;
            showingSolution = false;
            steps = 0;
            clearInterval(timerInterval);
            timerInterval = null;

            resizeCanvas();
            generateMaze();
            draw();
        }
        
        // 关卡选择
        function showLevelSelect() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 20; i++) {
                const btn = document.createElement('button');
                const unlocked = i <= gameData.maxLevel;
                btn.textContent = i;
                btn.style.cssText = `
                    padding: 10px;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: bold;
                    cursor: ${unlocked ? 'pointer' : 'not-allowed'};
                    background: ${unlocked ? 'linear-gradient(135deg, #667eea, #764ba2)' : 'rgba(255,255,255,0.1)'};
                    color: ${unlocked ? 'white' : 'rgba(255,255,255,0.3)'};
                `;
                
                if (unlocked) {
                    btn.onclick = () => selectLevel(i);
                }
                grid.appendChild(btn);
            }
            
            document.getElementById('levelModal').classList.add('show');
        }
        
        function closeLevelSelect() {
            document.getElementById('levelModal').classList.remove('show');
        }
        
        function selectLevel(lv) {
            closeLevelSelect();
            gameData.streak = 0;
            startLevel(lv);
        }

        // 显示提示
        function showSolution() {
            if (gameWon) return;
            usedHint = true;
            showingSolution = !showingSolution;
            
            // 从当前位置重新计算路径
            if (showingSolution) {
                const queue = [[playerX, playerY, []]];
                const visited = new Set();
                visited.add(`${playerX},${playerY}`);

                while (queue.length > 0) {
                    const [x, y, path] = queue.shift();

                    if (x === endX && y === endY) {
                        solutionPath = [...path, [x, y]];
                        break;
                    }

                    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                    for (const [dx, dy] of dirs) {
                        const nx = x + dx;
                        const ny = y + dy;
                        const key = `${nx},${ny}`;
                        if (nx >= 0 && nx < mazeSize && ny >= 0 && ny < mazeSize && 
                            maze[ny][nx] === 0 && !visited.has(key)) {
                            visited.add(key);
                            queue.push([nx, ny, [...path, [x, y]]]);
                        }
                    }
                }
            }
            
            draw();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    e.preventDefault();
                    move(0, -1);
                    break;
                case 'ArrowDown': case 's': case 'S':
                    e.preventDefault();
                    move(0, 1);
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    e.preventDefault();
                    move(-1, 0);
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    e.preventDefault();
                    move(1, 0);
                    break;
            }
        });

        // 触摸拖动控制
        let isDragging = false;
        let lastTouchX = 0, lastTouchY = 0;
        let dragAccumX = 0, dragAccumY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const cellSize = canvas.width / mazeSize;
            const touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            const touchY = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            
            // 检查是否点击在玩家上
            const playerCenterX = playerX * cellSize + cellSize / 2;
            const playerCenterY = playerY * cellSize + cellSize / 2;
            const dist = Math.sqrt((touchX - playerCenterX) ** 2 + (touchY - playerCenterY) ** 2);
            
            if (dist < cellSize) {
                isDragging = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                dragAccumX = 0;
                dragAccumY = 0;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || gameWon) return;
            e.preventDefault();
            
            const cellSize = canvas.width / mazeSize;
            const threshold = cellSize * 0.5; // 拖动阈值
            
            dragAccumX += e.touches[0].clientX - lastTouchX;
            dragAccumY += e.touches[0].clientY - lastTouchY;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
            
            // 根据累积拖动距离移动
            if (Math.abs(dragAccumX) > threshold || Math.abs(dragAccumY) > threshold) {
                if (Math.abs(dragAccumX) > Math.abs(dragAccumY)) {
                    move(dragAccumX > 0 ? 1 : -1, 0);
                } else {
                    move(0, dragAccumY > 0 ? 1 : -1);
                }
                dragAccumX = 0;
                dragAccumY = 0;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // 窗口大小改变
        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });

        // 存储
        function loadGameData() {
            try {
                const saved = localStorage.getItem('maze_data');
                if (saved) {
                    const data = JSON.parse(saved);
                    gameData.unlocked = data.unlocked || [];
                    gameData.maxLevel = data.maxLevel || 1;
                    gameData.streak = data.streak || 0;
                }
                document.getElementById('maxLevel').textContent = gameData.maxLevel;
            } catch(e) {}
        }

        function saveGameData() {
            try {
                localStorage.setItem('maze_data', JSON.stringify(gameData));
            } catch(e) {}
        }

        // 成就系统
        function unlockAchievement(id) {
            if (gameData.unlocked.includes(id)) return;
            gameData.unlocked.push(id);
            saveGameData();
            const ach = achievements.find(a => a.id === id);
            if (ach) {
                const toast = document.createElement('div');
                toast.className = 'achievement-toast';
                toast.innerHTML = `${ach.icon} 成就解锁：${ach.name}`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        }

        function showAchievements() {
            const list = document.getElementById('achievementList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = gameData.unlocked.includes(ach.id);
                return `
                    <div class="achievement-item ${unlocked ? '' : 'locked'}">
                        <span class="achievement-icon">${unlocked ? ach.icon : '🔒'}</span>
                        <div class="achievement-info">
                            <h3>${ach.name}</h3>
                            <p>${ach.desc}</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('achievementModal').classList.add('show');
        }

        function closeAchievements() {
            document.getElementById('achievementModal').classList.remove('show');
        }

        // 初始化
        loadGameData();
        startLevel(1);
    </script>
    <script src="fullscreen-btn.js"></script>
</body>
</html>
