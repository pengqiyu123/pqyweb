<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博终端 · Index2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a12;
            --surface: rgba(15, 18, 35, 0.9);
            --surface-strong: rgba(9, 13, 25, 0.96);
            --border: rgba(0, 240, 255, 0.15);
            --border-hover: rgba(0, 240, 255, 0.5);
            --text-primary: #e8edf5;
            --text-muted: rgba(232, 237, 245, 0.55);
            --accent-cyan: #00f0ff;
            --accent-pink: #ff2d78;
            --accent-green: #39ff14;
            --accent-purple: #a379ff;
            --accent-gold: #ffd166;
            --danger: #ff4d6d;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-pink: 0 0 20px rgba(255, 45, 120, 0.3);
            --topbar: 74px;
            --sidebar: 72px;
            --statusbar: 32px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text-primary);
            font-family: "Noto Sans SC", sans-serif;
            background:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                var(--bg);
            background-size: 40px 40px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: 1px;
            z-index: 20;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-pink), transparent);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.55);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .terminal-page {
            display: grid;
            grid-template-columns: var(--sidebar) minmax(0, 1fr);
            grid-template-rows: var(--topbar) minmax(0, 1fr) var(--statusbar);
            min-height: 100vh;
        }

        .terminal-topbar {
            position: sticky;
            top: 0;
            grid-column: 1 / -1;
            z-index: 12;
            display: grid;
            grid-template-columns: minmax(220px, auto) minmax(240px, 1fr) auto;
            align-items: center;
            gap: 18px;
            min-height: var(--topbar);
            padding: 14px 22px;
            border-bottom: 1px solid var(--border);
            background: rgba(6, 9, 18, 0.96);
        }

        .terminal-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: var(--glow-cyan);
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-title {
            display: block;
            color: var(--text-primary);
            font-family: "JetBrains Mono", monospace;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
        }

        .brand-subtitle {
            display: block;
            margin-top: 4px;
            color: var(--accent-green);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            letter-spacing: 0;
        }

        .terminal-search {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            min-height: 44px;
            border: 1px solid var(--border);
            background: #04070d;
            box-shadow: inset 0 0 18px rgba(0, 240, 255, 0.04);
        }

        .terminal-search:focus-within {
            border-color: var(--border-hover);
            box-shadow: inset 0 0 18px rgba(0, 240, 255, 0.08), var(--glow-cyan);
        }

        .prompt-prefix {
            padding-left: 14px;
            color: var(--accent-cyan);
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
        }

        .terminal-search input {
            width: 100%;
            min-width: 0;
            height: 42px;
            border: 0;
            outline: 0;
            color: var(--accent-cyan);
            background: transparent;
            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
        }

        .terminal-search input::placeholder {
            color: rgba(0, 240, 255, 0.48);
        }

        .cursor-dot {
            width: 9px;
            height: 18px;
            margin-right: 14px;
            background: var(--accent-cyan);
            animation: terminalBlink 1s steps(2, start) infinite;
            box-shadow: var(--glow-cyan);
        }

        @keyframes terminalBlink {
            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        .style-switch {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            white-space: nowrap;
        }

        .style-pill {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(255, 45, 120, 0.28);
            color: var(--text-primary);
            background: rgba(255, 45, 120, 0.06);
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .style-pill:hover,
        .style-pill:focus-visible {
            border-color: rgba(255, 45, 120, 0.7);
            box-shadow: var(--glow-pink);
            transform: translateY(-1px);
            outline: 0;
        }

        .home-link {
            border-color: rgba(0, 240, 255, 0.28);
            background: rgba(0, 240, 255, 0.06);
        }

        .terminal-sidebar {
            position: sticky;
            top: var(--topbar);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            grid-column: 1;
            grid-row: 2 / 4;
            height: calc(100vh - var(--topbar));
            padding: 18px 10px;
            border-right: 1px solid var(--border);
            background: rgba(6, 9, 18, 0.94);
        }

        .nav-button {
            position: relative;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 1px solid transparent;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .nav-button::before {
            content: "";
            position: absolute;
            left: -10px;
            width: 3px;
            height: 24px;
            background: transparent;
            box-shadow: none;
            transition: background 180ms ease, box-shadow 180ms ease;
        }

        .nav-button i {
            font-size: 19px;
        }

        .nav-button:hover,
        .nav-button:focus-visible {
            border-color: rgba(0, 240, 255, 0.22);
            color: var(--accent-cyan);
            transform: scale(1.06);
            box-shadow: var(--glow-cyan);
            outline: 0;
        }

        .nav-button[aria-selected="true"] {
            color: var(--accent-cyan);
            border-color: rgba(0, 240, 255, 0.32);
            background: rgba(0, 240, 255, 0.05);
        }

        .nav-button[aria-selected="true"]::before {
            background: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .terminal-main {
            grid-column: 2;
            grid-row: 2;
            min-width: 0;
            min-height: calc(100vh - var(--topbar) - var(--statusbar));
            padding: 30px;
        }

        .terminal-panel {
            display: flex;
            flex-direction: column;
            gap: 22px;
            min-height: 100%;
            opacity: 1;
            transition: opacity 200ms ease;
        }

        .terminal-panel.is-switching {
            opacity: 0;
        }

        .panel-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            min-height: 86px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.12);
            padding-bottom: 18px;
        }

        .panel-kicker {
            margin: 0 0 8px;
            color: var(--active-color, var(--accent-cyan));
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            font-weight: 700;
        }

        .panel-title {
            margin: 0;
            color: var(--text-primary);
            font-family: "JetBrains Mono", monospace;
            font-size: clamp(26px, 3vw, 42px);
            line-height: 1;
            letter-spacing: 0;
        }

        .panel-desc {
            max-width: 640px;
            margin: 10px 0 0;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .panel-count {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid color-mix(in srgb, var(--active-color, var(--accent-cyan)) 35%, transparent);
            color: var(--active-color, var(--accent-cyan));
            background: rgba(0, 0, 0, 0.18);
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            font-weight: 700;
        }

        .terminal-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            align-content: start;
        }

        .terminal-card {
            --accent: var(--accent-cyan);
            position: relative;
            display: grid;
            grid-template-columns: 3px minmax(0, 1fr);
            min-height: 162px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            opacity: 0;
            transform: translateY(10px);
            animation: cardBoot 360ms ease forwards;
            transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease, opacity 160ms ease, filter 160ms ease;
        }

        .terminal-card:hover,
        .terminal-card:focus-visible {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 24%, transparent);
            transform: translateY(-2px);
            outline: 0;
        }

        .terminal-card.is-dimmed {
            opacity: 0.2 !important;
            filter: saturate(0.35);
            transform: scale(0.985);
        }

        .card-edge {
            background: var(--accent);
            box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 48%, transparent);
        }

        .card-body {
            min-width: 0;
            padding: 18px;
        }

        .card-topline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            min-height: 24px;
        }

        .card-icon {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
            font-size: 13px;
        }

        .baidu-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 7px;
            color: #eaf7ff;
            background: #06a7ff;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 0 14px rgba(6, 167, 255, 0.36);
        }

        .terminal-card h4 {
            margin: 14px 0 8px;
            color: var(--text-primary);
            font-family: "JetBrains Mono", "Noto Sans SC", monospace;
            font-size: 17px;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .terminal-card p {
            display: -webkit-box;
            min-height: 48px;
            margin: 0;
            overflow: hidden;
            color: var(--text-muted);
            line-height: 1.7;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
        }

        .card-tags span {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 7px;
            border: 1px solid rgba(232, 237, 245, 0.12);
            color: rgba(232, 237, 245, 0.7);
            background: rgba(232, 237, 245, 0.035);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
        }

        @keyframes cardBoot {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .terminal-empty {
            display: none;
            min-height: 180px;
            place-items: center;
            border: 1px dashed rgba(255, 77, 109, 0.35);
            color: var(--danger);
            background: rgba(255, 77, 109, 0.035);
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            font-weight: 700;
        }

        .terminal-empty.is-visible {
            display: grid;
        }

        .terminal-statusbar {
            position: sticky;
            bottom: 0;
            z-index: 11;
            grid-column: 2;
            grid-row: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: var(--statusbar);
            padding: 0 18px;
            border-top: 1px solid var(--border);
            color: rgba(232, 237, 245, 0.68);
            background: var(--surface-strong);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
        }

        .status-ok {
            color: var(--accent-green);
        }

        @media (max-width: 1180px) {
            .terminal-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .terminal-topbar {
                grid-template-columns: 1fr;
                align-items: stretch;
                gap: 12px;
                min-height: auto;
            }

            .terminal-page {
                grid-template-rows: auto minmax(0, 1fr) var(--statusbar);
            }

            .style-switch {
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .terminal-sidebar {
                top: auto;
                height: calc(100vh - 150px);
            }
        }

        @media (max-width: 720px) {
            :root {
                --topbar: auto;
                --sidebar: 0px;
                --statusbar: 32px;
            }

            body {
                padding-bottom: 72px;
            }

            .terminal-page {
                display: block;
                min-height: 100vh;
            }

            .terminal-topbar {
                position: relative;
                padding: 16px;
            }

            .terminal-brand {
                align-items: flex-start;
            }

            .brand-title {
                font-size: 17px;
            }

            .style-pill {
                flex: 1 1 auto;
                justify-content: center;
            }

            .terminal-sidebar {
                position: fixed;
                inset: auto 0 0;
                z-index: 30;
                flex-direction: row;
                justify-content: space-around;
                width: 100%;
                height: 64px;
                padding: 8px 10px;
                border-top: 1px solid var(--border);
                border-right: 0;
                background: rgba(6, 9, 18, 0.98);
            }

            .nav-button {
                width: 48px;
                height: 48px;
            }

            .nav-button::before {
                inset: -8px auto auto 50%;
                width: 26px;
                height: 3px;
                transform: translateX(-50%);
            }

            .terminal-main {
                min-height: auto;
                padding: 20px 14px 36px;
            }

            .panel-head {
                display: block;
                min-height: auto;
            }

            .panel-count {
                margin-top: 16px;
            }

            .terminal-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .terminal-card {
                min-height: 178px;
            }

            .card-body {
                padding: 14px;
            }

            .terminal-card h4 {
                font-size: 15px;
            }

            .terminal-statusbar {
                position: fixed;
                inset: auto 0 64px;
                min-height: var(--statusbar);
                padding: 0 12px;
            }

            .fullscreen-btn {
                bottom: 108px !important;
            }
        }

        @media (max-width: 360px) {
            .terminal-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="terminal-page" data-testid="terminal-page">
        <header class="terminal-topbar">
            <a class="terminal-brand" href="index.html" aria-label="返回首页风格选择">
                <span class="brand-mark">YD</span>
                <span class="brand-copy">
                    <span class="brand-title">煜的工具站</span>
                    <span class="brand-subtitle">TERMINAL v2.0</span>
                </span>
            </a>

            <label class="terminal-search" for="terminalSearch">
                <span class="prompt-prefix">&gt;</span>
                <input id="terminalSearch" data-testid="terminal-search" type="search" autocomplete="off" placeholder="搜索资源...">
                <span class="cursor-dot" aria-hidden="true"></span>
            </label>

            <nav class="style-switch" aria-label="首页风格切换">
                <a class="style-pill home-link" href="index.html">HOME</a>
                <a class="style-pill" href="index1.html">星际奇妙站</a>
                <a class="style-pill" href="index3.html">纸艺工坊</a>
            </nav>
        </header>

        <nav class="terminal-sidebar" data-testid="terminal-nav" aria-label="赛博终端栏目">
            <button class="nav-button" type="button" data-section="tools" data-testid="terminal-nav-tools" aria-label="工具银河" aria-selected="true">
                <i class="fas fa-wrench" aria-hidden="true"></i>
            </button>
            <button class="nav-button" type="button" data-section="resources" data-testid="terminal-nav-resources" aria-label="百度资源" aria-selected="false">
                <i class="fas fa-cloud-download-alt" aria-hidden="true"></i>
            </button>
            <button class="nav-button" type="button" data-section="fun" data-testid="terminal-nav-fun" aria-label="趣味星球" aria-selected="false">
                <i class="fas fa-gamepad" aria-hidden="true"></i>
            </button>
            <button class="nav-button" type="button" data-section="learning" data-testid="terminal-nav-learning" aria-label="学习星河" aria-selected="false">
                <i class="fas fa-graduation-cap" aria-hidden="true"></i>
            </button>
            <button class="nav-button" type="button" data-section="ai" data-testid="terminal-nav-ai" aria-label="AI 星云" aria-selected="false">
                <i class="fas fa-robot" aria-hidden="true"></i>
            </button>
        </nav>

        <main class="terminal-main">
            <section class="terminal-panel" id="terminalPanel" aria-live="polite">
                <div class="panel-head">
                    <div>
                        <p class="panel-kicker" id="panelKicker">// TOOLS</p>
                        <h1 class="panel-title" id="panelTitle">工具银河</h1>
                        <p class="panel-desc" id="panelDescription">快速进入常用工具，把下载、转换、录制和资料入口收进同一个终端面板。</p>
                    </div>
                    <div class="panel-count" id="panelCount" data-testid="terminal-count">0 ITEM</div>
                </div>
                <div class="terminal-grid" id="terminalGrid" data-testid="terminal-grid"></div>
                <div class="terminal-empty" id="terminalEmpty" data-testid="terminal-empty">NO MATCH FOUND</div>
            </section>
        </main>

        <footer class="terminal-statusbar" data-testid="terminal-status">
            <span id="statusLabel">工具银河 · 0 项</span>
            <span class="status-ok">SYS.OK</span>
        </footer>
    </div>

    <script src="index.data.js"></script>
    <script>
        (function () {
            'use strict';

            const sectionConfig = [
                {
                    id: 'tools',
                    key: 'tools',
                    label: '工具银河',
                    code: 'TOOLS',
                    accent: '#00f0ff',
                    icon: 'fa-wrench',
                    description: '快速进入常用工具，把下载、转换、录制和资料入口收进同一个终端面板。',
                    tags: ['UTILITY', 'WEB']
                },
                {
                    id: 'resources',
                    key: 'baiduResources',
                    label: '百度资源',
                    code: 'BAIDU',
                    accent: '#a379ff',
                    icon: 'fa-cloud-download-alt',
                    description: '集中展示百度网盘资源，保留名称、链接、分类和简短说明。',
                    tags: ['PAN', 'RESOURCE']
                },
                {
                    id: 'fun',
                    key: 'funGames',
                    label: '趣味星球',
                    code: 'PLAY',
                    accent: '#ff2d78',
                    icon: 'fa-gamepad',
                    description: '小游戏和互动实验入口，用更轻的节奏切换一下大脑模式。',
                    tags: ['GAME', 'FUN']
                },
                {
                    id: 'learning',
                    key: 'learning',
                    label: '学习星河',
                    code: 'LEARN',
                    accent: '#39ff14',
                    icon: 'fa-graduation-cap',
                    description: '语文、数学、百科和 JS 逆向训练场集合，适合学习与课堂演示。',
                    tags: ['STUDY', 'LAB']
                },
                {
                    id: 'ai',
                    key: 'ai',
                    label: 'AI 星云',
                    code: 'AI',
                    accent: '#ffd166',
                    icon: 'fa-robot',
                    description: '常用 AI 助手入口，适合写作、问答、代码和资料整理。',
                    tags: ['MODEL', 'CHAT']
                }
            ];

            const state = {
                activeId: 'tools',
                query: ''
            };

            const data = window.INDEX_DATA || {};
            const panel = document.getElementById('terminalPanel');
            const grid = document.getElementById('terminalGrid');
            const empty = document.getElementById('terminalEmpty');
            const panelKicker = document.getElementById('panelKicker');
            const panelTitle = document.getElementById('panelTitle');
            const panelDescription = document.getElementById('panelDescription');
            const panelCount = document.getElementById('panelCount');
            const statusLabel = document.getElementById('statusLabel');
            const searchInput = document.getElementById('terminalSearch');
            const navButtons = Array.from(document.querySelectorAll('.nav-button'));

            function findConfig(id) {
                return sectionConfig.find(function (section) {
                    return section.id === id;
                }) || sectionConfig[0];
            }

            function getItems(config) {
                return Array.isArray(data[config.key]) ? data[config.key] : [];
            }

            function normalize(value) {
                return String(value || '').toLowerCase();
            }

            function createEl(tag, className, text) {
                const node = document.createElement(tag);
                if (className) {
                    node.className = className;
                }
                if (typeof text === 'string') {
                    node.textContent = text;
                }
                return node;
            }

            function safeHref(url) {
                const raw = String(url || '').trim();
                try {
                    const parsed = new URL(raw, window.location.href);
                    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                        return raw;
                    }
                } catch (error) {
                    return '#';
                }
                return '#';
            }

            function createCard(item, config, index) {
                const card = document.createElement('a');
                const href = safeHref(item.url);
                card.className = 'terminal-card';
                card.setAttribute('href', href);
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.dataset.testid = 'terminal-card';
                card.dataset.group = config.id;
                card.style.setProperty('--accent', config.accent);
                card.style.animationDelay = String(index * 50) + 'ms';
                card.setAttribute('data-search-index', normalize([
                    item.title,
                    item.description,
                    item.category,
                    Array.isArray(item.tags) ? item.tags.join(' ') : ''
                ].join(' ')));
                if (href === '#') {
                    card.setAttribute('aria-disabled', 'true');
                }

                const edge = createEl('div', 'card-edge');
                const body = createEl('div', 'card-body');
                const topline = createEl('div', 'card-topline');
                const icon = createEl('span', 'card-icon');
                const iconNode = document.createElement('i');
                iconNode.className = 'fas ' + config.icon;
                iconNode.setAttribute('aria-hidden', 'true');
                icon.appendChild(iconNode);
                topline.appendChild(icon);

                if (config.id === 'resources') {
                    topline.appendChild(createEl('span', 'baidu-badge', '百度网盘'));
                }

                const title = createEl('h4', '', item.title || '未命名资源');
                const description = createEl('p', '', item.description || '暂无描述');
                const tags = createEl('div', 'card-tags');
                const cardTags = Array.isArray(item.tags) && item.tags.length ? item.tags : config.tags;
                cardTags.slice(0, 4).forEach(function (tag) {
                    tags.appendChild(createEl('span', '', tag));
                });
                if (item.category) {
                    tags.appendChild(createEl('span', '', item.category));
                }

                body.appendChild(topline);
                body.appendChild(title);
                body.appendChild(description);
                body.appendChild(tags);
                card.appendChild(edge);
                card.appendChild(body);
                return card;
            }

            function applySearch() {
                const query = normalize(state.query.trim());
                const cards = Array.from(grid.querySelectorAll('.terminal-card'));
                let matches = 0;

                cards.forEach(function (card) {
                    const matched = !query || card.getAttribute('data-search-index').includes(query);
                    if (matched) {
                        matches += 1;
                    }
                    card.classList.toggle('is-dimmed', Boolean(query && !matched));
                    card.dataset.match = matched ? 'true' : 'false';
                });

                empty.classList.toggle('is-visible', Boolean(query && matches === 0));
                updateStatus(matches, cards.length);
            }

            function updateStatus(matchCount, total) {
                const config = findConfig(state.activeId);
                const hasQuery = Boolean(state.query.trim());
                const countText = hasQuery ? matchCount + '/' + total : String(total);
                panelCount.textContent = countText + (total === 1 ? ' ITEM' : ' ITEMS');
                statusLabel.textContent = config.label + ' · ' + countText + ' 项';
            }

            function renderSection(nextId) {
                const config = findConfig(nextId);
                const items = getItems(config);

                state.activeId = config.id;
                document.documentElement.style.setProperty('--active-color', config.accent);
                panel.style.setProperty('--active-color', config.accent);
                panelKicker.textContent = '// ' + config.code;
                panelTitle.textContent = config.label;
                panelDescription.textContent = config.description;

                grid.replaceChildren();
                items.forEach(function (item, index) {
                    grid.appendChild(createCard(item, config, index));
                });

                navButtons.forEach(function (button) {
                    const isActive = button.dataset.section === config.id;
                    button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });

                applySearch();
            }

            function activateSection(nextId, syncHash) {
                const config = findConfig(nextId);
                if (config.id === state.activeId && grid.children.length) {
                    return;
                }
                panel.classList.add('is-switching');
                window.setTimeout(function () {
                    renderSection(config.id);
                    panel.classList.remove('is-switching');
                    if (syncHash) {
                        history.replaceState(null, '', '#' + config.id);
                    }
                }, 120);
            }

            navButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    activateSection(button.dataset.section, true);
                });
            });

            searchInput.addEventListener('input', function (event) {
                state.query = event.target.value;
                applySearch();
            });

            window.addEventListener('hashchange', function () {
                const id = window.location.hash.replace('#', '');
                if (id) {
                    activateSection(id, false);
                }
            });

            const initialId = window.location.hash.replace('#', '') || 'tools';
            renderSection(findConfig(initialId).id);
        })();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>

</html>
