<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D地球模型</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            z-index: 10;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 20;
        }
        
        #loading-bar-container {
            width: 300px;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        #loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        #loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
        
        #error-message {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            font-size: 16px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        
        /* 旋转动画 */
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .spinner {
            position: absolute;
            top: 60%;
            left: 50%;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
    </style>
</head>
<body>
    <div id="instructions">拖动/触摸地球旋转 | Drag/Touch to rotate the Earth</div>
    <div id="loading">
        <div>正在加载地球模型...</div>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">正在初始化场景...</div>
    </div>
    <div id="error-message">加载失败，请检查网络连接或稍后重试</div>
    <div class="spinner" id="spinner"></div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 获取DOM元素
        const container = document.getElementById('container');
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error-message');
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.getElementById('spinner');
        
        // 初始化场景
        const scene = new THREE.Scene();
        
        // 初始化相机
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 2;
        
        // 初始化渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // 创建地球几何体
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        
        // 创建默认材质（无纹理）
        const defaultMaterial = new THREE.MeshPhongMaterial({
            color: 0x2233ff,
            specular: new THREE.Color(0x333333),
            shininess: 5
        });
        
        // 创建地球网格（先使用默认材质）
        const earth = new THREE.Mesh(geometry, defaultMaterial);
        scene.add(earth);
        
        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(2, 1, 3).normalize();
        scene.add(directionalLight);
        
        // 加载贴图
        const textureLoader = new THREE.TextureLoader();
        
        // 显示错误信息的函数
        function showError(message) {
            console.error(message);
            loadingElement.style.display = 'none';
            spinner.style.display = 'none';
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        // 更新加载进度
        function updateLoadingProgress(progress, message) {
            // 确保进度值在0-100之间
            const clampedProgress = Math.max(0, Math.min(100, progress));
            loadingBar.style.width = clampedProgress + '%';
            loadingText.textContent = message;
        }
        
        // 创建带有所有纹理的完整材质
        function createEarthMaterial(textures) {
            return new THREE.MeshPhongMaterial({
                map: textures.map || null,
                bumpMap: textures.bumpMap || null,
                bumpScale: 0.05,
                specularMap: textures.specularMap || null,
                specular: new THREE.Color(0x333333),
                shininess: 5
            });
        }
        
        // 纹理加载状态跟踪
        const textureStatus = {
            map: { loaded: false, texture: null, name: '基础贴图', progress: 0 },
            bumpMap: { loaded: false, texture: null, name: '法线贴图', progress: 0 },
            specularMap: { loaded: false, texture: null, name: '高光贴图', progress: 0 }
        };
        
        // 更新地球材质
        function updateEarthMaterial() {
            // 只有当地球对象存在时才更新材质
            if (earth) {
                const textures = {};
                if (textureStatus.map.loaded) textures.map = textureStatus.map.texture;
                if (textureStatus.bumpMap.loaded) textures.bumpMap = textureStatus.bumpMap.texture;
                if (textureStatus.specularMap.loaded) textures.specularMap = textureStatus.specularMap.texture;
                
                const newMaterial = createEarthMaterial(textures);
                earth.material.dispose(); // 释放旧材质
                earth.material = newMaterial;
            }
        }
        
        // 计算总体加载进度
        function calculateOverallProgress() {
            const totalTextures = Object.keys(textureStatus).length;
            let loadedTextures = 0;
            let totalProgress = 0;
            
            Object.values(textureStatus).forEach(texture => {
                if (texture.loaded) {
                    loadedTextures++;
                    totalProgress += 100;
                } else if (texture.progress) {
                    totalProgress += texture.progress;
                }
            });
            
            return Math.round(totalProgress / totalTextures);
        }
        
        // 检查是否所有纹理都已加载完成
        function areAllTexturesLoaded() {
            return Object.values(textureStatus).every(texture => texture.loaded);
        }
        
        // 加载基础贴图
        textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
            function(texture) {
                // 成功加载基础贴图
                textureStatus.map.loaded = true;
                textureStatus.map.texture = texture;
                updateEarthMaterial();
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '已完成 ' + textureStatus.map.name);
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
            },
            function(xhr) {
                // 加载进度回调
                const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                textureStatus.map.progress = percentComplete;
                const currentProgress = calculateOverallProgress();
                updateLoadingProgress(Math.min(currentProgress, 95), '正在加载 ' + textureStatus.map.name + ' (' + percentComplete + '%)');
                
                // 显示旋转动画
                spinner.style.display = 'block';
            },
            function(error) {
                // 基础贴图加载失败，使用默认材质
                console.warn('基础贴图加载失败，使用默认蓝色材质:', error);
                textureStatus.map.loaded = true; // 标记为已完成，即使失败
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '跳过 ' + textureStatus.map.name + ' (加载失败)');
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
                
                showError('基础贴图加载失败: ' + error.message);
            }
        );
        
        // 加载法线贴图
        textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
            function(texture) {
                textureStatus.bumpMap.loaded = true;
                textureStatus.bumpMap.texture = texture;
                updateEarthMaterial();
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '已完成 ' + textureStatus.bumpMap.name);
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
            },
            function(xhr) {
                // 加载进度回调
                const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                textureStatus.bumpMap.progress = percentComplete;
                const currentProgress = calculateOverallProgress();
                updateLoadingProgress(Math.min(currentProgress, 95), '正在加载 ' + textureStatus.bumpMap.name + ' (' + percentComplete + '%)');
                
                // 显示旋转动画
                spinner.style.display = 'block';
            },
            function(error) {
                console.warn('法线贴图加载失败:', error);
                textureStatus.bumpMap.loaded = true; // 标记为已完成，即使失败
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '跳过 ' + textureStatus.bumpMap.name + ' (加载失败)');
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
                
                showError('法线贴图加载失败: ' + error.message);
            }
        );
        
        // 加载高光贴图
        textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
            function(texture) {
                textureStatus.specularMap.loaded = true;
                textureStatus.specularMap.texture = texture;
                updateEarthMaterial();
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '已完成 ' + textureStatus.specularMap.name);
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
            },
            function(xhr) {
                // 加载进度回调
                const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                textureStatus.specularMap.progress = percentComplete;
                const currentProgress = calculateOverallProgress();
                updateLoadingProgress(Math.min(currentProgress, 95), '正在加载 ' + textureStatus.specularMap.name + ' (' + percentComplete + '%)');
                
                // 显示旋转动画
                spinner.style.display = 'block';
            },
            function(error) {
                console.warn('高光贴图加载失败:', error);
                textureStatus.specularMap.loaded = true; // 标记为已完成，即使失败
                
                // 更新进度
                const progress = calculateOverallProgress();
                updateLoadingProgress(progress, '跳过 ' + textureStatus.specularMap.name + ' (加载失败)');
                
                // 检查是否所有纹理都已加载完成
                if (areAllTexturesLoaded()) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        spinner.style.display = 'none';
                    }, 500);
                }
                
                showError('高光贴图加载失败: ' + error.message);
            }
        );
        
        // 交互控制
        let isDragging = false;
        let previousPosition = {
            x: 0,
            y: 0
        };
        
        // 鼠标按下事件
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousPosition = {
                x: e.clientX,
                y: e.clientY
            };
        });
        
        // 鼠标移动事件
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousPosition.x;
                const deltaY = e.clientY - previousPosition.y;
                
                earth.rotation.y += deltaX * 0.01;
                earth.rotation.x += deltaY * 0.01;
                
                previousPosition = {
                    x: e.clientX,
                    y: e.clientY
                };
            }
        });
        
        // 鼠标释放事件
        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        // 鼠标离开事件
        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        // 触摸开始事件（移动设备支持）
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 防止页面滚动
            isDragging = true;
            const touch = e.touches[0];
            previousPosition = {
                x: touch.clientX,
                y: touch.clientY
            };
        }, { passive: false });
        
        // 触摸移动事件（移动设备支持）
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 防止页面滚动
            if (isDragging && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - previousPosition.x;
                const deltaY = touch.clientY - previousPosition.y;
                
                earth.rotation.y += deltaX * 0.02; // 移动设备上增加灵敏度
                earth.rotation.x += deltaY * 0.02;
                
                previousPosition = {
                    x: touch.clientX,
                    y: touch.clientY
                };
            }
        }, { passive: false });
        
        // 触摸结束事件（移动设备支持）
        renderer.domElement.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // 触摸取消事件（移动设备支持）
        renderer.domElement.addEventListener('touchcancel', () => {
            isDragging = false;
        });
        
        // 禁用右键菜单
        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // 窗口大小调整事件
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 非拖动状态下自动旋转
            if (!isDragging) {
                earth.rotation.y += 0.001;
            }
            
            renderer.render(scene, camera);
        }
        
        // 启动动画
        animate();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>
</html>
