            if (poem) poem.style.display = 'none';
            quiz.style.display = 'block';
            if (alphabetIndex) alphabetIndex.style.display = 'none';
            
            // 检查是否有保存的测试状态
            const savedQuizState = localStorage.getItem('quizState');
            if (savedQuizState && quizData && quizData.length > 0) {
                // 恢复测试状态
                restoreQuizState();
            } else {
                // 没有保存的状态或测试数据，重新开始测试
                startQuiz();
            }
        }
    }

    // ===== 保存测试状态到localStorage =====
    function saveQuizState() {
        // 如果测试已完成，清除状态而不是保存
        if (quizCompleted) {
            clearQuizState();
            return;
        }
        
        // 检查数据是否有效
        if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
            return;
        }
        
        // 如果 quizIndex 超出范围，清除状态而不是保存无效状态
        if (quizIndex < 0 || quizIndex >= quizData.length) {
            clearQuizState();
            return;
        }
        
        const quizState = {
            quizData: quizData,
            quizIndex: quizIndex,
            quizScore: quizScore,
            quizCorrectIds: quizCorrectIds,
            quizWrongIds: quizWrongIds,
            quizTotalCorrect: quizTotalCorrect,
            quizTotalWrong: quizTotalWrong,
            saveTime: Date.now()
        };
        localStorage.setItem('quizState', JSON.stringify(quizState));
    }

    // ===== 从localStorage恢复测试状态 =====
    function restoreQuizState() {
        const savedState = localStorage.getItem('quizState');
        if (savedState) {
            try {
                const quizState = JSON.parse(savedState);
                
                // 检查状态是否过期（超过1小时）
                const currentTime = Date.now();
                if (currentTime - quizState.saveTime > 3600000) { // 1小时
                    localStorage.removeItem('quizState');
                    startQuiz();
                    return;
                }
                
                // 恢复测试状态
                quizData = quizState.quizData;
                quizIndex = quizState.quizIndex;
                quizScore = quizState.quizScore;
                quizCorrectIds = quizState.quizCorrectIds;
                quizWrongIds = quizState.quizWrongIds;
                quizTotalCorrect = quizState.quizTotalCorrect;
                quizTotalWrong = quizState.quizTotalWrong;
                quizCompleted = false; // 恢复状态时，测试尚未完成
                
                // 验证恢复的状态是否有效
                if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
                    console.error('恢复的测试数据无效，重新开始测试');
                    localStorage.removeItem('quizState');
                    startQuiz();
                    return;
                }
                
                // 检查 quizIndex 是否超出范围
                if (quizIndex < 0) {
                    quizIndex = 0;
                } else if (quizIndex >= quizData.length) {
                    // 如果索引超出范围，说明测试已经完成，直接显示结果
                    console.log('测试已完成，显示结果');
                    showQuizResult();
                    return;
                }
                
                // 更新UI显示
                updateQuizProgress(false);
                updateQuizTotalProgress();
                renderQuizQuestion();
                
                console.log('测试状态已恢复');
            } catch (error) {
                console.error('恢复测试状态失败', error);
                startQuiz();
            }
        } else {
            startQuiz();
        }
    }

    // ===== 清除保存的测试状态 =====
    function clearQuizState() {
        localStorage.removeItem('quizState');
    }

    // ===== 趣味测试：从Idiom stories1.json加载测试数据 =====
    function startQuiz() {
        const loadingState = document.getElementById('quizLoadingState');
        const quizContent = document.getElementById('quizScore');
        
        // 显示加载动画，隐藏测试内容
        if (loadingState) {
            loadingState.style.display = 'block';
        }
        if (quizContent) {
            quizContent.parentElement.querySelectorAll('#quizQuestion, #quizOptions, #quizFeedback, #quizTotalProgress, #nextQuestionBtn, #restartQuizBtn, #quizResult').forEach(el => {
                if (el) el.style.display = 'none';
            });
        }

        // 从指定JSON文件加载数据
        fetch('idiom/Idiom stories1.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error('无法加载测试数据文件');
                }
                return res.json();
            })
            .then(data => {
                if (!Array.isArray(data)) {
                    throw new Error('测试数据格式错误');
                }

                const available = data.filter(item => item.text && item.meaning);
                if (available.length < 4) {
                    if (loadingState) loadingState.style.display = 'none';
                    alert('可用成语数据少于 4 条，无法进行测试。');
                    switchMode('browse');
                    return;
                }

                // 重置测试状态
                quizCorrectIds = [];
                quizWrongIds = [];
                quizScore = 0;
                quizIndex = 0;
                quizTotalCorrect = 0; // 测试总答对数量
                quizTotalWrong = 0;   // 测试总答错数量
                quizCompleted = false; // 重置完成标志

                // 从localStorage加载已掌握的成语记录
                const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
                
                // 过滤掉已掌握的成语，只保留未掌握的成语
                const availableForQuiz = available.filter(item => !masteredRecords[item.text]);
                
                // 如果可用成语不足10个，从已掌握的成语中随机选择补充
                let finalAvailable = [...availableForQuiz];
                if (finalAvailable.length < 10) {
                    const masteredItems = available.filter(item => masteredRecords[item.text]);
                    const needed = 10 - finalAvailable.length;
                    // 随机打乱已掌握的成语，然后取需要的数量
                    const shuffledMastered = masteredItems.sort(() => Math.random() - 0.5);
                    finalAvailable = [...finalAvailable, ...shuffledMastered.slice(0, needed)];
                }

                // 生成题目，固定为10题
                const questions = finalAvailable.map(item => ({
                    idiomId: item.text || item.id || Math.random().toString(36).substr(2, 9),
                    text: item.text,
                    correct: item.meaning,
                    options: buildOptionsFromData(item, available),
                    isMastered: masteredRecords[item.text] || false // 标记是否已掌握
                }));
                questions.sort(() => Math.random() - 0.5);
                quizData = questions.slice(0, 10); // 固定取10题

                // 数据加载完成，隐藏加载动画，显示测试内容
                if (loadingState) {
                    loadingState.style.display = 'none';
                }
                if (quizContent) {
                    quizContent.parentElement.querySelectorAll('#quizQuestion, #quizOptions, #quizFeedback, #quizTotalProgress, #nextQuestionBtn, #restartQuizBtn').forEach(el => {
                        if (el) el.style.display = '';
                    });
                }

                // 显示测试总进度
                const totalProgressContainer = document.getElementById('quizTotalProgress');
                if (totalProgressContainer) {
                    totalProgressContainer.style.display = 'block';
                }
                
                updateQuizProgress(false);
                updateQuizTotalProgress();
                renderQuizQuestion();
            })
            .catch(err => {
                console.error('加载测试数据失败', err);
                if (loadingState) {
                    loadingState.style.display = 'none';
                }
                alert('加载测试数据失败，请检查文件路径或格式。');
                switchMode('browse');
            });
    }

    function buildOptions(correctIdiom, pool) {
        const opts = [correctIdiom.meaning];
        while (opts.length < 4 && pool.length > 1) {
            const r = pool[Math.floor(Math.random() * pool.length)];
            if (!opts.includes(r.meaning)) {
                opts.push(r.meaning);
            }
        }
        return opts.sort(() => Math.random() - 0.5);
    }

    function buildOptionsFromData(correctItem, pool) {
        const opts = [correctItem.meaning];
        while (opts.length < 4 && pool.length > 1) {
            const r = pool[Math.floor(Math.random() * pool.length)];
            if (r !== correctItem && !opts.includes(r.meaning)) {
                opts.push(r.meaning);
            }
        }
        return opts.sort(() => Math.random() - 0.5);
    }

    function renderQuizQuestion() {
        // 检查数据是否已准备好
        if (!quizData || quizData.length === 0) {
            console.log('测试数据尚未加载完成，等待中...');
            return;
        }
        
        const questionArea = document.getElementById('quizQuestion');
        const optionsArea = document.getElementById('quizOptions');
        const feedback = document.getElementById('quizFeedback');
        const btnNext = document.getElementById('nextQuestionBtn');
        const scoreEl = document.getElementById('quizScore');
        const resultEl = document.getElementById('quizResult');
        
        if (!questionArea || !optionsArea || !feedback || !btnNext) {
            return;
        }
        
        resultEl.innerHTML = '';

        // 检查数据是否有效
        if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
            console.error('测试数据无效，无法渲染题目');
            return;
        }

        // 检查 quizIndex 是否超出范围
        if (quizIndex < 0) {
            quizIndex = 0;
        } else if (quizIndex >= quizData.length) {
            // 如果索引超出范围，直接显示结果
            showQuizResult();
            return;
        }

        const q = quizData[quizIndex];
        if (!q || !q.text) {
            console.error('题目数据无效');
            showQuizResult();
            return;
        }
        
        scoreEl.textContent = `当前得分：${quizScore} / ${quizData.length}`;
        questionArea.textContent = `${quizIndex + 1}. 成语"${q.text}"的意思是？`;

        optionsArea.innerHTML = '';
        feedback.textContent = '';
        btnNext.disabled = true;

        // 如果是第十题，将按钮文本改为"完成答题"
        if (quizIndex === quizData.length - 1) {
            btnNext.textContent = '完成答题';
        } else {
            btnNext.textContent = '下一题';
        }

        q.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'quiz-option';
            div.textContent = opt;
            div.dataset.index = idx;
            div.addEventListener('click', () => selectOption(div, q));
            optionsArea.appendChild(div);
        });
    }

    function selectOption(el, q) {
        // 检查测试是否已完成
        if (quizCompleted) {
            return;
        }
        
        // 检查数据是否已准备好
        if (!quizData || quizData.length === 0) {
            console.log('测试数据尚未加载完成，无法答题');
            return;
        }
        
        const options = document.querySelectorAll('.quiz-option');
        const feedback = document.getElementById('quizFeedback');
        const btnNext = document.getElementById('nextQuestionBtn');

        if (!feedback || !btnNext) {
            return;
        }

        if ([...options].some(o => o.classList.contains('correct') || o.classList.contains('incorrect'))) {
            return;
        }

        const selected = el.textContent;
        const isCorrect = selected === q.correct;

        options.forEach(o => {
            if (o.textContent === q.correct) {
                o.classList.add('correct');
            }
            if (o === el && !isCorrect) {
                o.classList.add('incorrect');
            }
        });

        if (isCorrect) {
            quizScore++;
            quizCorrectIds.push(q.idiomId);
            
            // 立即更新分数显示
            const scoreEl = document.getElementById('quizScore');
            if (scoreEl) {
                scoreEl.textContent = `当前得分：${quizScore} / ${quizData.length}`;
            }
            
            // 答对时增加总进度
            quizTotalCorrect++;
            
            // 从localStorage加载答错记录和已掌握记录
            const wrongRecords = JSON.parse(localStorage.getItem(wrongKey) || '{}');
            const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
            
            // 获取之前的尝试次数（可能在答错记录中，也可能在已掌握记录中）
            let previousAttempts = 0;
            if (wrongRecords[q.text]) {
                previousAttempts = wrongRecords[q.text].attempts || 0;
                // 如果这个成语之前答错过，现在答对了，从答错记录移除
                delete wrongRecords[q.text];
                localStorage.setItem(wrongKey, JSON.stringify(wrongRecords));
            } else if (masteredRecords[q.text]) {
                previousAttempts = masteredRecords[q.text].attempts || 0;
            }
            
            // 答对的成语不再进入测试（标记为已掌握）
            masteredRecords[q.text] = {
                id: q.idiomId,
                text: q.text,
                pinyin: q.pinyin || '',
                meaning: q.correct,
                masteredAt: new Date().toLocaleString('zh-CN'),
                attempts: previousAttempts + 1
            };
            localStorage.setItem(masteredKey, JSON.stringify(masteredRecords));
            
            // 更新成语故事进度条
            updatePoemProgress();
            
            // 更新成语历史记录显示（实时更新已掌握成语）
            displayIdiomHistory();
            
            feedback.innerHTML = '<span class="text-success">回答正确！</span>';
        } else {
            quizWrongIds.push(q.idiomId);
            quizTotalWrong++;
            
            // 答错时记录到localStorage
            const wrongRecords = JSON.parse(localStorage.getItem(wrongKey) || '{}');
            wrongRecords[q.text] = {
                id: q.idiomId,
                text: q.text,
                pinyin: q.pinyin || '',
                meaning: q.correct,
                wrongAt: new Date().toLocaleString('zh-CN'),
                attempts: (wrongRecords[q.text]?.attempts || 0) + 1
            };
            localStorage.setItem(wrongKey, JSON.stringify(wrongRecords));
            
            // 更新成语历史记录显示（实时更新待掌握成语）
            displayIdiomHistory();
            
            feedback.innerHTML = `<span class="text-danger">回答错误，正确答案是：${q.correct}</span>`;
        }

        updateQuizProgress(true);
        updateQuizTotalProgress();
        btnNext.disabled = false;
        
        // 保存测试状态
        saveQuizState();
    }

    function nextQuizQuestion() {
        // 如果测试已完成，不允许继续
        if (quizCompleted) {
            return;
        }
        
        // 检查数据是否有效
        if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
            console.error('测试数据无效');
            return;
        }
        
        // 如果当前是最后一题，点击"完成答题"按钮应该显示结果
        if (quizIndex >= quizData.length - 1) {
            showQuizResult();
            return;
        }
        
        quizIndex++;
        
        // 再次检查 quizIndex 是否超出范围（双重保险）
        if (quizIndex >= quizData.length) {
            showQuizResult();
            return;
        }
        
        updateQuizProgress(false);
        
        // 保存测试状态
        saveQuizState();
        
        renderQuizQuestion();
    }

    function updateQuizProgress(answered) {
        // 进度条功能已删除，此函数不再执行任何操作
    }

    // 更新测试总进度
    function updateQuizTotalProgress() {
        const totalProgressText = document.getElementById('quizTotalProgressText');
        const totalProgressBar = document.getElementById('quizTotalProgressBar');
        const correctCount = document.getElementById('quizCorrectCount');
        const wrongCount = document.getElementById('quizWrongCount');
        
        if (totalProgressText) {
            totalProgressText.textContent = quizTotalCorrect + '/10';
        }
        if (totalProgressBar) {
            const progress = Math.round((quizTotalCorrect / 10) * 100);
            totalProgressBar.style.width = progress + '%';
        }
        if (correctCount) {
            correctCount.textContent = quizTotalCorrect;
        }
        if (wrongCount) {
            wrongCount.textContent = quizTotalWrong;
        }
    }

    function showQuizResult() {
        // 防止重复调用
        if (quizCompleted) {
            return;
        }
        
        // 标记测试已完成
        quizCompleted = true;
        
        // 禁用"完成答题"按钮，防止重复点击
        const btnNext = document.getElementById('nextQuestionBtn');
        if (btnNext) {
            btnNext.disabled = true;
            btnNext.textContent = '测试已完成';
        }
        
        // 禁用所有选项按钮，防止继续操作
        const options = document.querySelectorAll('.quiz-option');
        options.forEach(opt => {
            opt.style.pointerEvents = 'none';
            opt.style.opacity = '0.6';
        });
        
        // 保存历史记录
        saveQuizHistory();
        
        // 清除保存的测试状态（测试已完成）
        clearQuizState();

        const total = quizData.length || 0;
        const percent = total ? Math.round((quizScore / total) * 100) : 0;

        // 如果答对10题，显示特殊表扬弹窗
        if (quizTotalCorrect === 10) {
            showPerfectPraiseModal();
        } else {
            // 显示普通表扬弹窗
            showPraiseModal(percent);
        }

        const resultEl = document.getElementById('quizResult');
        const correctList = quizCorrectIds.map(id => findIdiomById(id)).filter(Boolean);
        const wrongList = quizWrongIds.map(id => findIdiomById(id)).filter(Boolean);

        resultEl.innerHTML = `
            <hr />
            <div class="mb-2 fw-semibold">测试完成！得分：${quizScore} / ${total}（${percent}%）</div>
            <div class="mb-2">测试总进度：${quizTotalCorrect}/10</div>
            <div class="row">
                <div class="col-md-6 mb-2">
                    <div class="fw-semibold mb-1">本次答对的成语（${correctList.length} 条）</div>
                    ${correctList.length ? '<ul class="mb-0 small">' + correctList.map(i => `<li>${i.text}：${i.meaning}</li>`).join('') + '</ul>' : '<div class="small text-muted">暂无。</div>'}
                </div>
                <div class="col-md-6 mb-2">
                    <div class="fw-semibold mb-1">本次答错的成语（${wrongList.length} 条）</div>
                    ${wrongList.length ? '<ul class="mb-0 small">' + wrongList.map(i => `<li>${i.text}：${i.meaning}</li>`).join('') + '</ul>' : '<div class="small text-muted">暂无。</div>'}
                </div>
            </div>
        `;

        // 自动显示历史记录，不需要点击按钮
        showQuizHistory();
        // 更新成语历史记录显示（包括已掌握和待掌握）
        displayIdiomHistory();
    }

    // 保存测试历史记录（包含答对和答错的成语详情）
    function saveQuizHistory() {
        const historyKey = 'chengyu_quiz_history_v1';
        const history = JSON.parse(localStorage.getItem(historyKey) || '[]');
        
        // 获取答对和答错的成语详情
        const correctIdioms = quizCorrectIds.map(id => findIdiomById(id)).filter(Boolean);
        const wrongIdioms = quizWrongIds.map(id => findIdiomById(id)).filter(Boolean);
        
        const historyItem = {
            date: new Date().toLocaleString('zh-CN'),
            timestamp: Date.now(),
            score: quizScore,
            total: quizData.length,
            percent: quizData.length ? Math.round((quizScore / quizData.length) * 100) : 0,
            correctCount: quizCorrectIds.length,
            wrongCount: quizWrongIds.length,
            correctIdioms: correctIdioms.map(idiom => ({
                text: idiom.text,
                pinyin: idiom.pinyin,
                meaning: idiom.meaning
            })),
            wrongIdioms: wrongIdioms.map(idiom => ({
                text: idiom.text,
                pinyin: idiom.pinyin,
                meaning: idiom.meaning
            }))
        };
        
        history.unshift(historyItem); // 添加到开头
        
        // 只保留最近10条记录
        if (history.length > 10) {
            history.splice(10);
        }
        
        localStorage.setItem(historyKey, JSON.stringify(history));
        
        // 更新历史记录显示
        displayQuizHistory();
    }

    // 显示历史记录
    function displayQuizHistory() {
        const historyKey = 'chengyu_quiz_history_v1';
        const history = JSON.parse(localStorage.getItem(historyKey) || '[]');

        quizHistory.style.display = 'block';

            document.getElementById('history-list').innerHTML = '<div class="text-muted">暂无答题记录</div>';
        } else {

            const historyList = document.getElementById('history-list');
            
            // 按时间戳倒序排列（最新的在前面）
            history.sort((a, b) => b.timestamp - a.timestamp);

            const quizRecordsHTML = history.map((record, index) => {
                const recordNumber = history.length - index; // 第几次答题

                            <span class="history-title">第${recordNumber}次作答</span>
                            <span class="history-status ${isGoodScore ? 'correct' : 'wrong'}">${isGoodScore ? '✅' : '❌'} ${record.percent}%</span>
                        </div>
                        <div class="history-meta">
                            <span>${record.date}</span>
                            <span>答对: ${record.correctCount} | 答错: ${record.wrongCount}</span>
                        </div>
                        <div class="history-details mt-2">
                            <div class="history-score-info">
                                <span class="score-badge ${isGoodScore ? 'bg-success' : 'bg-danger'}">${record.score}/${record.total}</span>
                                <small class="text-muted ms-2">正确率: ${record.percent}%</small>
                            </div>
                            
                            <!-- 答对的成语 -->
                            ${record.correctIdioms.length > 0 ? `
                                <div class="mt-2">
                                    <small class="text-success fw-semibold">答对成语:</small>
                                    <div class="idiom-list mt-1">
                                        ${record.correctIdioms.map(idiom => 
                                            `<span class="idiom-tag correct">${idiom.text}</span>`
                                        ).join('')}
                                    </div>
                                </div>
                            ` : ''}
                            
                            <!-- 答错的成语 -->
                            ${record.wrongIdioms.length > 0 ? `
                                <div class="mt-2">
                                    <small class="text-danger fw-semibold">答错成语:</small>
                                    <div class="idiom-list mt-1">
                                        ${record.wrongIdioms.map(idiom => 
                                            `<span class="idiom-tag wrong">${idiom.text}</span>`
                                        ).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

            // 显示记录
            historyList.innerHTML = quizRecordsHTML;
        }
    }

    // 清除历史记录
    function clearQuizHistory() {
        const historyKey = 'chengyu_quiz_history_v1';
        localStorage.removeItem(historyKey);
        displayQuizHistory();
    }

    // 显示测试历史记录（兼容旧版本）
    function showQuizHistory() {
        displayQuizHistory();
    }

    // 显示成语历史记录
    function displayIdiomHistory() {
        const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
        const wrongRecords = JSON.parse(localStorage.getItem(wrongKey) || '{}');
        
        // 显示已掌握的成语
        const masteredList = document.getElementById('mastered-list');
        const masteredCount = Object.keys(masteredRecords).length;
        
        if (masteredCount === 0) {
            masteredList.innerHTML = '<div class="no-history">暂无已掌握的成语</div>';
        } else {
            const masteredHTML = Object.values(masteredRecords).map(idiom => {
                const date = new Date(idiom.masteredAt);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                
                return `
                    <div class="history-item">
                        <div class="history-item-title">${idiom.text} ✅</div>
                        <div class="history-item-info">${dateStr} | 尝试次数: ${idiom.attempts || 1}</div>
                        <button class="btn btn-sm btn-outline-danger remove-btn" onclick="removeMasteredIdiom('${idiom.text}')">
                            移除
                        </button>
                    </div>
                `;
            }).join('');
            
            masteredList.innerHTML = masteredHTML;
        }
        
        // 显示待掌握的成语
        const wrongList = document.getElementById('wrong-list');
        const wrongCount = Object.keys(wrongRecords).length;
        
        if (wrongCount === 0) {
            wrongList.innerHTML = '<div class="no-history">暂无待掌握的成语</div>';
        } else {
            const wrongHTML = Object.values(wrongRecords).map(idiom => {
                const date = new Date(idiom.wrongAt);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                
                return `
                    <div class="history-item">
                        <div class="history-item-title">${idiom.text} ❌</div>
                        <div class="history-item-info">${dateStr} | 答错次数: ${idiom.attempts || 1}</div>
                        <button class="btn btn-sm btn-outline-success master-btn" onclick="markAsMastered('${idiom.text}')">
                            标记为已掌握
                        </button>
                    </div>
                `;
            }).join('');
            
            wrongList.innerHTML = wrongHTML;
        }
        
        // 更新计数标签
        document.getElementById('mastered-count').textContent = masteredCount;
        document.getElementById('wrong-count').textContent = wrongCount;
        
        // 更新成语故事进度条
        updatePoemProgress();
    }

    // 从已掌握列表中移除成语
    function removeMasteredIdiom(idiomText) {
        const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
        
        if (masteredRecords[idiomText]) {
            // 将成语移到答错列表
            const wrongRecords = JSON.parse(localStorage.getItem(wrongKey) || '{}');
            wrongRecords[idiomText] = {
                ...masteredRecords[idiomText],
                wrongAt: new Date().toLocaleString('zh-CN'),
                attempts: (masteredRecords[idiomText].attempts || 0) + 1
            };
            
            delete masteredRecords[idiomText];
            
            localStorage.setItem(masteredKey, JSON.stringify(masteredRecords));
            localStorage.setItem(wrongKey, JSON.stringify(wrongRecords));
            
            // 更新显示
            displayIdiomHistory();
        }
    }

    // 将成语标记为已掌握
    function markAsMastered(idiomText) {
        const wrongRecords = JSON.parse(localStorage.getItem(wrongKey) || '{}');
        
        if (wrongRecords[idiomText]) {
            // 将成语移到已掌握列表
            const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
            masteredRecords[idiomText] = {
                ...wrongRecords[idiomText],
                masteredAt: new Date().toLocaleString('zh-CN')
            };
            
            delete wrongRecords[idiomText];
            
            localStorage.setItem(masteredKey, JSON.stringify(masteredRecords));
            localStorage.setItem(wrongKey, JSON.stringify(wrongRecords));
            
            // 更新显示
            displayIdiomHistory();
        }
    }

    // 清除成语历史记录
    function clearIdiomHistory() {
        if (confirm('确定要清除所有成语历史记录吗？此操作不可恢复。')) {
            localStorage.removeItem(masteredKey);
            localStorage.removeItem(wrongKey);
            displayIdiomHistory();
        }
    }

    // 更新成语故事界面的学习总进度
    function updatePoemProgress() {
        const progressBar = document.getElementById('poemProgressBar');
        const progressText = document.getElementById('poemProgressText');
        const progressContainer = document.getElementById('poemProgressContainer');
        
        if (!progressBar || !progressText || !progressContainer) return;
        
        // 计算已掌握的成语数量（从localStorage获取）
        const masteredRecords = JSON.parse(localStorage.getItem(masteredKey) || '{}');
        const masteredCount = Object.keys(masteredRecords).length;
        
        // 获取总成语故事数量
        const totalCount = idiomStories.length;
        
        if (totalCount > 0) {
            const percent = Math.round((masteredCount / totalCount) * 100);
            progressBar.style.width = percent + '%';
            progressText.textContent = `${masteredCount}/${totalCount}`;
            progressContainer.style.display = 'block';
        } else {
            progressContainer.style.display = 'none';
        }
    }

    function findIdiomById(id) {
        for (let g = 1; g <= 9; g++) {
            const arr = idiomDatabase[g];
            if (!arr) continue;
            const found = arr.find(i => i.id === id);
            if (found) return found;
        }
        return null;
    }
</script>
