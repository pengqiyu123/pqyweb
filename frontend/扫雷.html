<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫雷</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: #e5e7eb;
        }

        .game-container {
            background: rgba(15, 23, 42, 0.96);
            border-radius: 18px;
            padding: 16px 16px 18px;
            box-shadow:
                0 18px 40px rgba(15, 23, 42, 0.9),
                0 0 0 1px rgba(148, 163, 184, 0.35);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fbbf24;
            text-shadow: 0 0 16px rgba(251, 191, 36, 0.8);
        }

        .subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .stats {
            display: flex;
            gap: 8px;
        }

        .stat-box {
            min-width: 70px;
            padding: 6px 10px;
            border-radius: 8px;
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.8);
            font-size: 11px;
            text-align: center;
        }

        .stat-box .value {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .controls-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .hint {
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .settings-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 11px;
            color: #9ca3af;
        }

        .settings-row label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .settings-row input {
            width: 44px;
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid rgba(148, 163, 184, 0.8);
            background: #020617;
            color: #e5e7eb;
            font-size: 11px;
        }

        .btn-main,
        .btn-secondary {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .btn-main {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: #022c22;
            box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.8);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.95);
            color: #e5e7eb;
            box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.7);
        }

        .btn-secondary.active {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: #022c22;
            box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.8);
        }

        .btn-main:active,
        .btn-secondary:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 0 0 1px rgba(226, 232, 240, 0.9);
        }

        .board-wrapper {
            display: flex;
            justify-content: center;
        }

        .board {
            max-width: 100%;
            display: grid;
            gap: 2px;
            padding: 4px;
            border-radius: 10px;
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.8);
        }

        .board.mine-hit {
            animation: board-mine-hit 0.4s ease-in-out;
        }

        .board.win {
            animation: board-win-pulse 0.9s ease-in-out;
        }

        .cell {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: #111827;
            box-shadow: inset 0 0 0 1px rgba(55, 65, 81, 0.9);
            color: #e5e7eb;
            font-size: 18px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .cell.revealed {
            background: #020617;
            box-shadow: inset 0 0 0 1px rgba(31, 41, 55, 1);
            cursor: default;
        }

        .cell.mine.revealed {
            background: #b91c1c;
            box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 1);
        }

        .cell.flagged {
            background: #1f2933;
            box-shadow: inset 0 0 0 1px rgba(252, 165, 165, 0.9);
            color: #fbbf24;
        }

        .cell.num-1 { color: #60a5fa; }
        .cell.num-2 { color: #34d399; }
        .cell.num-3 { color: #fb7185; }
        .cell.num-4 { color: #a855f7; }
        .cell.num-5 { color: #f97316; }
        .cell.num-6 { color: #22d3ee; }
        .cell.num-7 { color: #fbbf24; }
        .cell.num-8 { color: #9ca3af; }

        .status {
            margin-top: 4px;
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
        }

        @keyframes board-mine-hit {
            0% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        @keyframes board-win-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.8);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(52, 211, 153, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
            }
        }

        @media (max-width: 400px) {
            .cell {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
        }

        /* 模式选择 */
        .mode-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.95);
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.5);
        }

        .mode-btn:hover {
            color: #e5e7eb;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: #022c22;
            box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.8);
        }

        .mode-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 辅助高亮 */
        .cell.assist-highlight {
            box-shadow: inset 0 0 0 2px #fbbf24, 0 0 8px rgba(251, 191, 36, 0.6);
            background: rgba(251, 191, 36, 0.15) !important;
        }

        .cell.assist-center {
            box-shadow: inset 0 0 0 3px #f97316, 0 0 12px rgba(249, 115, 22, 0.8);
            background: rgba(249, 115, 22, 0.25) !important;
        }

        /* 关卡选择 */
        .level-selector {
            margin: 8px 0;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .level-btn {
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 0 0 1px rgba(55, 65, 81, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .level-btn .level-num {
            font-size: 16px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .level-btn .level-mines {
            font-size: 10px;
            color: #6b7280;
        }

        .level-btn:hover:not(.locked) {
            background: #1f2937;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .level-btn.active .level-num,
        .level-btn.active .level-mines {
            color: #fff;
        }

        .level-btn.completed {
            background: #065f46;
            box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.5);
        }

        .level-btn.completed .level-num {
            color: #34d399;
        }

        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fbbf24;
        }

        .modal-content p {
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #e5e7eb;
        }

        .win-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        /* 数据网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: left;
            margin: 15px 0;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }

        .stat-item .label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .stat-item .value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #22c55e;
        }

        /* 成就网格 */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: left;
            margin: 15px 0;
            max-height: 50vh;
            overflow-y: auto;
        }

        .achievement-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .achievement-item.unlocked {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .achievement-item .icon {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .achievement-item .name {
            font-size: 11px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 2px;
        }

        .achievement-item .desc {
            font-size: 9px;
            color: #6b7280;
        }

        .achievement-item.unlocked .desc {
            color: #22c55e;
        }

        .modal-large {
            width: 500px;
            max-width: 95vw;
        }

        .section-title {
            font-size: 14px;
            color: #9ca3af;
            margin: 20px 0 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .section-title span {
            font-size: 12px;
            color: #6b7280;
        }

        .btn-danger {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* 弹窗滚动条 */
        .modal-content::-webkit-scrollbar,
        .achievements-grid::-webkit-scrollbar {
            width: 4px;
        }

        .modal-content::-webkit-scrollbar-track,
        .achievements-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-content::-webkit-scrollbar-thumb,
        .achievements-grid::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.3);
            border-radius: 4px;
        }

        @media (max-width: 400px) {
            .level-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 4px;
            }
            .level-btn {
                padding: 8px 4px;
            }
            .level-btn .level-num {
                font-size: 14px;
            }
            .achievements-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 成就解锁通知 */
        .achievement-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            z-index: 2000;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            pointer-events: none;
        }

        .achievement-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #fbbf24;
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3), 0 0 20px rgba(251, 191, 36, 0.2);
            animation: toast-glow 1.5s ease-in-out infinite;
        }

        @keyframes toast-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3), 0 0 20px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 8px 32px rgba(251, 191, 36, 0.5), 0 0 30px rgba(251, 191, 36, 0.4); }
        }

        .toast-icon {
            font-size: 2.5rem;
            animation: toast-bounce 0.6s ease-in-out;
        }

        @keyframes toast-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .toast-info {
            text-align: left;
        }

        .toast-title {
            font-size: 12px;
            color: #fbbf24;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toast-name {
            font-size: 16px;
            color: #fff;
            font-weight: 700;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-row">
            <div>
                <div class="title">扫雷</div>
                <div class="subtitle" id="subtitle">小心地雷，标记全部，安全通关！</div>
            </div>
            <div class="stats">
                <div class="stat-box">
                    雷数
                    <span class="value" id="minesLeft">10</span>
                </div>
                <div class="stat-box">
                    时间
                    <span class="value" id="time">0</span>
                </div>
            </div>
        </div>

        <!-- 模式选择 -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btnLevelMode">🎯 闯关模式</button>
            <button class="mode-btn" id="btnCustomMode">⚙️ 自定义</button>
            <button class="mode-btn" id="btnStatsBtn">📊 数据</button>
        </div>

        <!-- 闯关模式关卡选择 -->
        <div class="level-selector" id="levelSelector">
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <!-- 自定义模式设置 -->
        <div class="settings-row" id="customSettings" style="display:none;">
            <label>行 <input type="number" id="rowsInput" min="5" max="20" value="9" /></label>
            <label>列 <input type="number" id="colsInput" min="5" max="20" value="9" /></label>
            <label>雷数 <input type="number" id="minesInput" min="1" value="10" /></label>
        </div>

        <div class="controls-row">
            <div class="buttons">
                <button class="btn-main" id="btnNew">▶ 开始</button>
                <button class="btn-secondary" id="btnMarkMode">🚩 标记</button>
                <button class="btn-secondary" id="btnAssist">🔍 辅助</button>
            </div>
            <div class="hint">
                电脑：左键翻开，右键插旗<br />
                手机：短按翻开 / 标记模式插旗，长按也可插旗
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        <div class="status" id="status">选择关卡开始挑战！</div>
    </div>

    <!-- 数据与成就弹窗 -->
    <div class="modal" id="statsModal">
        <div class="modal-content modal-large">
            <button class="close-btn" onclick="closeModal('statsModal')">×</button>
            <h2>📊 数据与成就</h2>
            
            <h3 class="section-title">游戏统计</h3>
            <div class="stats-grid" id="statsContent"></div>
            
            <h3 class="section-title">🏆 成就 <span id="achieveProgress"></span></h3>
            <div class="achievements-grid" id="achieveContent"></div>
            
            <button class="btn-danger" id="btnClearData" onclick="confirmClearData()">🗑️ 清除所有记录</button>
        </div>
    </div>

    <!-- 成就解锁通知 -->
    <div class="achievement-toast" id="achievementToast">
        <div class="toast-content">
            <div class="toast-icon" id="toastIcon">🏆</div>
            <div class="toast-info">
                <div class="toast-title">成就解锁！</div>
                <div class="toast-name" id="toastName"></div>
            </div>
        </div>
    </div>

    <!-- 通关弹窗 -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 id="winTitle">🎉 恭喜通关！</h2>
            <p id="winMessage"></p>
            <div class="win-buttons">
                <button class="btn-main" id="btnNextLevel">下一关</button>
                <button class="btn-secondary" id="btnBackToLevels">返回关卡</button>
            </div>
        </div>
    </div>

    <script>
        // 关卡配置：10关，地图逐渐变大，雷密度保持合理(10%-25%)
        const LEVELS = [
            { level: 1, rows: 8, cols: 8, mines: 5 },    // 7.8%
            { level: 2, rows: 9, cols: 9, mines: 10 },   // 12.3%
            { level: 3, rows: 10, cols: 10, mines: 15 }, // 15%
            { level: 4, rows: 10, cols: 10, mines: 20 }, // 20%
            { level: 5, rows: 11, cols: 11, mines: 25 }, // 20.7%
            { level: 6, rows: 12, cols: 12, mines: 30 }, // 20.8%
            { level: 7, rows: 12, cols: 12, mines: 35 }, // 24.3%
            { level: 8, rows: 13, cols: 13, mines: 40 }, // 23.7%
            { level: 9, rows: 14, cols: 14, mines: 45 }, // 23%
            { level: 10, rows: 15, cols: 15, mines: 50 } // 22.2%
        ];
        const UNLOCK_CUSTOM_AT = 5; // 通过5关解锁自定义

        // 成就定义
        const achievements = [
            { id: 'first_win', name: '首次胜利', desc: '完成第一局扫雷', icon: '🌟' },
            { id: 'level_5', name: '中级挑战者', desc: '通过第5关', icon: '🎯' },
            { id: 'level_10', name: '扫雷大师', desc: '通过第10关', icon: '👑' },
            { id: 'all_levels', name: '全关卡通关', desc: '通过全部10关', icon: '🏆' },
            { id: 'speed_30', name: '闪电手', desc: '30秒内完成一局', icon: '⚡' },
            { id: 'speed_60', name: '快手', desc: '60秒内完成一局', icon: '🚀' },
            { id: 'no_flag', name: '裸奔大师', desc: '不使用旗子完成一局', icon: '🎭' },
            { id: 'win_10', name: '扫雷新手', desc: '累计胜利10局', icon: '🥉' },
            { id: 'win_50', name: '扫雷老手', desc: '累计胜利50局', icon: '🥈' },
            { id: 'win_100', name: '扫雷专家', desc: '累计胜利100局', icon: '🥇' },
            { id: 'streak_3', name: '三连胜', desc: '连续胜利3局', icon: '🔥' },
            { id: 'streak_5', name: '五连胜', desc: '连续胜利5局', icon: '💪' },
            { id: 'custom_win', name: '自定义玩家', desc: '在自定义模式胜利', icon: '⚙️' },
            { id: 'play_1h', name: '扫雷迷', desc: '累计游戏时长超过1小时', icon: '⏰' }
        ];

        let ROWS = 9;
        let COLS = 9;
        let MINES = 10;

        const boardEl = document.getElementById('board');
        const containerEl = document.querySelector('.game-container');
        const minesLeftEl = document.getElementById('minesLeft');
        const timeEl = document.getElementById('time');
        const statusEl = document.getElementById('status');
        const btnNew = document.getElementById('btnNew');
        const btnMarkMode = document.getElementById('btnMarkMode');
        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const minesInput = document.getElementById('minesInput');

        // 新增元素
        const btnLevelMode = document.getElementById('btnLevelMode');
        const btnCustomMode = document.getElementById('btnCustomMode');
        const btnStatsBtn = document.getElementById('btnStatsBtn');
        const levelSelector = document.getElementById('levelSelector');
        const levelGrid = document.getElementById('levelGrid');
        const customSettings = document.getElementById('customSettings');
        const subtitleEl = document.getElementById('subtitle');

        let board = [];
        let minesLeft = MINES;
        let gameOver = false;
        let firstClick = true;
        let markMode = false;
        let time = 0;
        let timerId = null;
        let longPressTimer = null;
        let longPressCell = null;
        let longPressStartX = 0;
        let longPressStartY = 0;
        let longPressTriggered = false;

        // 新增状态
        let currentMode = 'level'; // 'level' 或 'custom'
        let currentLevel = 1;
        let usedFlags = false;
        let gameStats = loadStats();
        let assistMode = false;
        let assistCenter = null;

        const btnAssist = document.getElementById('btnAssist');

        function setStatus(text) {
            if (statusEl) {
                statusEl.textContent = text;
            }
        }

        function startTimer() {
            if (timerId) clearInterval(timerId);
            time = 0;
            timeEl.textContent = '0';
            timerId = setInterval(() => {
                time++;
                timeEl.textContent = String(time);
            }, 1000);
        }

        function stopTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
        }

        function playMineHitAnimation() {
            if (!boardEl) return;
            boardEl.classList.remove('mine-hit', 'win');
            void boardEl.offsetWidth;
            boardEl.classList.add('mine-hit');
        }

        function playWinAnimation() {
            if (!boardEl) return;
            boardEl.classList.remove('mine-hit', 'win');
            void boardEl.offsetWidth;
            boardEl.classList.add('win');
        }

        function createEmptyBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                const row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push({
                        row: r,
                        col: c,
                        mine: false,
                        revealed: false,
                        flagged: false,
                        adjacent: 0,
                        el: null,
                    });
                }
                board.push(row);
            }
        }

        function inBounds(r, c) {
            return r >= 0 && r < ROWS && c >= 0 && c < COLS;
        }

        function forEachNeighbor(r, c, cb) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr;
                    const nc = c + dc;
                    if (inBounds(nr, nc)) cb(board[nr][nc]);
                }
            }
        }

        function placeMines(firstRow, firstCol) {
            let placed = 0;
            while (placed < MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                const cell = board[r][c];
                if (cell.mine || (r === firstRow && c === firstCol)) continue;
                cell.mine = true;
                placed++;
            }
            // 计算相邻雷数
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = board[r][c];
                    if (cell.mine) {
                        cell.adjacent = 0;
                    } else {
                        let count = 0;
                        forEachNeighbor(r, c, (n) => {
                            if (n.mine) count++;
                        });
                        cell.adjacent = count;
                    }
                }
            }
        }

        function updateCellView(cell) {
            const el = cell.el;
            if (!el) return;
            el.className = 'cell';
            if (cell.revealed) {
                el.classList.add('revealed');
                if (cell.mine) {
                    el.classList.add('mine');
                    el.textContent = '💣';
                } else if (cell.adjacent > 0) {
                    el.textContent = String(cell.adjacent);
                    el.classList.add('num-' + cell.adjacent);
                } else {
                    el.textContent = '';
                }
            } else {
                if (cell.flagged) {
                    el.classList.add('flagged');
                    el.textContent = '🚩';
                } else {
                    el.textContent = '';
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = board[r][c];
                    if (cell.mine) {
                        cell.revealed = true;
                        cell.flagged = false;
                        updateCellView(cell);
                    }
                }
            }
        }

        function floodReveal(startCell) {
            const queue = [startCell];
            while (queue.length) {
                const cell = queue.shift();
                if (cell.revealed || cell.flagged) continue;
                cell.revealed = true;
                updateCellView(cell);
                if (cell.adjacent === 0 && !cell.mine) {
                    forEachNeighbor(cell.row, cell.col, (n) => {
                        if (!n.revealed && !n.flagged && !n.mine) {
                            queue.push(n);
                        }
                    });
                }
            }
        }

        function checkWin() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = board[r][c];
                    if (!cell.mine && !cell.revealed) {
                        return false;
                    }
                }
            }
            return true;
        }

        function handleReveal(cell) {
            if (gameOver || cell.flagged || cell.revealed) return;
            if (firstClick) {
                placeMines(cell.row, cell.col);
                firstClick = false;
                startTimer();
            }

            if (cell.mine) {
                cell.revealed = true;
                updateCellView(cell);
                gameOver = true;
                stopTimer();
                revealAllMines();
                handleLose();
                setStatus('踩到地雷了！点击"开始游戏"再试一次。');
                playMineHitAnimation();
                return;
            }

            if (cell.adjacent === 0) {
                floodReveal(cell);
            } else {
                cell.revealed = true;
                updateCellView(cell);
            }

            if (checkWin()) {
                gameOver = true;
                stopTimer();
                handleWin();
            }
        }

        function toggleFlag(cell) {
            if (gameOver || cell.revealed) return;
            if (!cell.flagged && minesLeft === 0) return;
            cell.flagged = !cell.flagged;
            usedFlags = true;
            if (cell.flagged) {
                minesLeft--;
            } else {
                minesLeft++;
            }
            minesLeftEl.textContent = String(minesLeft);
            updateCellView(cell);
        }

        // 处理胜利
        function handleWin() {
            // 更新统计
            gameStats.totalGames++;
            gameStats.totalWins++;
            gameStats.totalTime += time;
            gameStats.currentStreak++;
            if (gameStats.currentStreak > gameStats.bestStreak) {
                gameStats.bestStreak = gameStats.currentStreak;
            }

            if (currentMode === 'level') {
                // 记录关卡通过
                if (!gameStats.levelsCompleted.includes(currentLevel)) {
                    gameStats.levelsCompleted.push(currentLevel);
                }
                // 更新最佳时间
                const timeKey = `bestTimeLevel${currentLevel}`;
                if (!gameStats[timeKey] || time < gameStats[timeKey]) {
                    gameStats[timeKey] = time;
                }
            } else {
                gameStats.customWins++;
            }

            saveStats();
            const newAchievements = checkNewAchievements();

            // 显示胜利弹窗
            if (currentMode === 'level') {
                document.getElementById('winTitle').textContent = `🎉 第${currentLevel}关通过！`;
                let msg = `用时: ${time}秒`;
                if (newAchievements.length > 0) {
                    msg += `<br><br>🏆 新成就: ${newAchievements.map(a => a.name).join(', ')}`;
                }
                document.getElementById('winMessage').innerHTML = msg;
                document.getElementById('btnNextLevel').style.display = currentLevel < 10 ? 'block' : 'none';
                document.getElementById('winModal').classList.add('show');
            } else {
                setStatus(`恭喜通关！用时: ${time}秒`);
                playWinAnimation();
            }

            renderLevelGrid();
        }

        // 处理失败
        function handleLose() {
            gameStats.totalGames++;
            gameStats.currentStreak = 0;
            gameStats.totalTime += time;
            saveStats();
        }

        // 清除辅助高亮
        function clearAssistHighlight() {
            document.querySelectorAll('.cell.assist-highlight, .cell.assist-center').forEach(el => {
                el.classList.remove('assist-highlight', 'assist-center');
            });
            assistCenter = null;
        }

        // 显示辅助高亮（只显示外围一圈）
        function showAssistHighlight(cell) {
            clearAssistHighlight();
            
            // 只有已翻开且有数字的格子才能使用辅助
            if (!cell.revealed || cell.mine || cell.adjacent === 0) return;
            
            assistCenter = cell;
            const r = cell.row;
            const c = cell.col;

            // 只高亮周围8个格子（不高亮中心）
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr;
                    const nc = c + dc;
                    if (inBounds(nr, nc)) {
                        const neighbor = board[nr][nc];
                        if (neighbor.el) {
                            neighbor.el.classList.add('assist-highlight');
                        }
                    }
                }
            }
        }

        // 处理辅助模式点击
        function handleAssistClick(cell) {
            if (!assistMode) return false;
            
            // 如果点击的是已翻开有数字的格子，显示高亮
            if (cell.revealed && !cell.mine && cell.adjacent > 0) {
                // 如果点击同一个格子，切换关闭
                if (assistCenter === cell) {
                    clearAssistHighlight();
                } else {
                    showAssistHighlight(cell);
                }
                return true;
            }
            
            // 点击其他地方，清除高亮但继续正常操作
            clearAssistHighlight();
            return false;
        }

        function createBoardElements() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = board[r][c];
                    const btn = document.createElement('button');
                    btn.className = 'cell';
                    btn.setAttribute('data-row', String(r));
                    btn.setAttribute('data-col', String(c));

                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        // 辅助模式优先处理
                        if (handleAssistClick(cell)) return;
                        
                        if (markMode) {
                            toggleFlag(cell);
                        } else {
                            handleReveal(cell);
                        }
                    });

                    btn.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        toggleFlag(cell);
                    });

                    btn.addEventListener('touchstart', (e) => {
                        const touch = e.touches[0];
                        longPressStartX = touch.clientX;
                        longPressStartY = touch.clientY;
                        longPressCell = cell;
                        longPressTriggered = false;
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                        }
                        longPressTimer = setTimeout(() => {
                            longPressTimer = null;
                            longPressTriggered = true;
                            if (longPressCell) {
                                toggleFlag(longPressCell);
                            }
                        }, 450);
                        e.preventDefault();
                    });

                    btn.addEventListener('touchmove', (e) => {
                        if (!longPressTimer) return;
                        const touch = e.touches[0];
                        const dx = touch.clientX - longPressStartX;
                        const dy = touch.clientY - longPressStartY;
                        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                            longPressCell = null;
                        }
                    });

                    btn.addEventListener('touchend', (e) => {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                            if (!longPressTriggered) {
                                // 辅助模式优先处理
                                if (handleAssistClick(cell)) {
                                    // 辅助模式已处理
                                } else if (markMode) {
                                    toggleFlag(cell);
                                } else {
                                    handleReveal(cell);
                                }
                            }
                        }
                        longPressCell = null;
                        e.preventDefault();
                    });

                    btn.addEventListener('touchcancel', () => {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                        longPressCell = null;
                    });

                    cell.el = btn;
                    boardEl.appendChild(btn);
                }
            }
        }

        function resetGame() {
            stopTimer();

            if (boardEl) {
                boardEl.classList.remove('mine-hit', 'win');
            }

            let rows = ROWS;
            let cols = COLS;
            let mines = MINES;

            // 闯关模式使用关卡配置，自定义模式使用输入框
            if (currentMode === 'level') {
                const levelConfig = LEVELS.find(l => l.level === currentLevel);
                rows = levelConfig.rows;
                cols = levelConfig.cols;
                mines = levelConfig.mines;
            } else if (rowsInput && colsInput && minesInput) {
                rows = parseInt(rowsInput.value, 10) || ROWS;
                cols = parseInt(colsInput.value, 10) || COLS;
                mines = parseInt(minesInput.value, 10) || MINES;
            }

            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 800;
            const maxColsDesktop = 20;
            const maxColsMobile = 12;
            const isMobile = viewportWidth <= 600;
            const colsMax = isMobile ? maxColsMobile : maxColsDesktop;

            rows = Math.max(5, Math.min(20, rows));
            cols = Math.max(5, Math.min(colsMax, cols));
            const maxMines = rows * cols - 1;
            mines = Math.max(1, Math.min(maxMines, mines));

            ROWS = rows;
            COLS = cols;
            MINES = mines;

            if (rowsInput && colsInput && minesInput) {
                rowsInput.value = ROWS;
                colsInput.value = COLS;
                minesInput.value = MINES;
                rowsInput.max = '20';
                colsInput.max = String(colsMax);
            }

            if (boardEl) {
                const baseCellSize = 32;
                const gap = 2;
                const padding = 4;
                const rawBoardWidth = COLS * baseCellSize + (COLS - 1) * gap + padding * 2;

                const maxBoardWidth = Math.max(260, viewportWidth - 48);
                const finalBoardWidth = Math.min(rawBoardWidth, maxBoardWidth);

                boardEl.style.width = finalBoardWidth + 'px';

                if (containerEl) {
                    const containerExtra = 32;
                    const containerMaxWidth = viewportWidth - 32;
                    const targetContainerWidth = Math.min(finalBoardWidth + containerExtra, containerMaxWidth);
                    containerEl.style.width = targetContainerWidth + 'px';
                }
            }

            createEmptyBoard();
            createBoardElements();
            minesLeft = MINES;
            minesLeftEl.textContent = String(minesLeft);
            timeEl.textContent = '0';
            gameOver = false;
            firstClick = true;
            usedFlags = false;
            clearAssistHighlight();
            
            if (currentMode === 'level') {
                setStatus(`第${currentLevel}关 - ${MINES}颗雷，第一步不会踩雷！`);
            } else {
                setStatus('第一步不会踩雷，试着清除整个棋盘吧！');
            }
        }

        // 加载统计数据
        function loadStats() {
            const saved = localStorage.getItem('minesweeper_stats');
            if (saved) {
                return JSON.parse(saved);
            }
            return {
                totalGames: 0,
                totalWins: 0,
                totalTime: 0,
                currentStreak: 0,
                bestStreak: 0,
                levelsCompleted: [],
                customWins: 0,
                achievements: []
            };
        }

        // 保存统计数据
        function saveStats() {
            localStorage.setItem('minesweeper_stats', JSON.stringify(gameStats));
        }

        // 检查成就
        function checkNewAchievements() {
            const newUnlocked = [];
            const check = (id) => {
                if (!gameStats.achievements.includes(id)) {
                    gameStats.achievements.push(id);
                    const a = achievements.find(x => x.id === id);
                    if (a) newUnlocked.push(a);
                }
            };

            if (gameStats.totalWins >= 1) check('first_win');
            if (gameStats.totalWins >= 10) check('win_10');
            if (gameStats.totalWins >= 50) check('win_50');
            if (gameStats.totalWins >= 100) check('win_100');
            if (gameStats.currentStreak >= 3) check('streak_3');
            if (gameStats.currentStreak >= 5) check('streak_5');
            if (gameStats.levelsCompleted.includes(5)) check('level_5');
            if (gameStats.levelsCompleted.includes(10)) check('level_10');
            if (gameStats.levelsCompleted.length >= 10) check('all_levels');
            if (gameStats.customWins >= 1) check('custom_win');
            if (time <= 30) check('speed_30');
            if (time <= 60) check('speed_60');
            if (!usedFlags) check('no_flag');
            if (gameStats.totalTime >= 3600) check('play_1h');

            saveStats();

            // 显示成就解锁动画
            newUnlocked.forEach(a => showAchievementToast(a));

            return newUnlocked;
        }

        // 渲染关卡选择
        function renderLevelGrid() {
            levelGrid.innerHTML = '';
            LEVELS.forEach(lvl => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                const isCompleted = gameStats.levelsCompleted.includes(lvl.level);
                const isUnlocked = lvl.level === 1 || gameStats.levelsCompleted.includes(lvl.level - 1);
                
                if (isCompleted) btn.classList.add('completed');
                if (!isUnlocked) btn.classList.add('locked');
                if (lvl.level === currentLevel) btn.classList.add('active');

                btn.innerHTML = `
                    <span class="level-num">${isCompleted ? '✓' : lvl.level}</span>
                    <span class="level-mines">${lvl.rows}×${lvl.cols}</span>
                    <span class="level-mines">${lvl.mines}雷</span>
                `;

                btn.addEventListener('click', () => {
                    if (!isUnlocked) return;
                    currentLevel = lvl.level;
                    ROWS = lvl.rows;
                    COLS = lvl.cols;
                    MINES = lvl.mines;
                    renderLevelGrid();
                });

                levelGrid.appendChild(btn);
            });
        }

        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            btnLevelMode.classList.toggle('active', mode === 'level');
            btnCustomMode.classList.toggle('active', mode === 'custom');
            levelSelector.style.display = mode === 'level' ? 'block' : 'none';
            customSettings.style.display = mode === 'custom' ? 'flex' : 'none';

            if (mode === 'level') {
                subtitleEl.textContent = '闯关模式 - 地图逐渐变大，挑战50颗雷！';
                const levelConfig = LEVELS.find(l => l.level === currentLevel);
                ROWS = levelConfig.rows;
                COLS = levelConfig.cols;
                MINES = levelConfig.mines;
            } else {
                subtitleEl.textContent = '自定义模式 - 自由设置棋盘和雷数';
            }
        }

        // 显示数据与成就弹窗
        function showStats() {
            const winRate = gameStats.totalGames > 0 
                ? Math.round(gameStats.totalWins / gameStats.totalGames * 100) : 0;
            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                return m > 0 ? `${m}分${s % 60}秒` : `${s}秒`;
            };

            // 统计数据
            document.getElementById('statsContent').innerHTML = `
                <div class="stat-item"><div class="label">总局数</div><div class="value">${gameStats.totalGames}</div></div>
                <div class="stat-item"><div class="label">胜利局数</div><div class="value">${gameStats.totalWins}</div></div>
                <div class="stat-item"><div class="label">胜率</div><div class="value">${winRate}%</div></div>
                <div class="stat-item"><div class="label">当前连胜</div><div class="value">${gameStats.currentStreak}</div></div>
                <div class="stat-item"><div class="label">最高连胜</div><div class="value">${gameStats.bestStreak}</div></div>
                <div class="stat-item"><div class="label">关卡进度</div><div class="value">${gameStats.levelsCompleted.length}/10</div></div>
                <div class="stat-item"><div class="label">自定义胜利</div><div class="value">${gameStats.customWins}</div></div>
                <div class="stat-item"><div class="label">总游戏时长</div><div class="value">${formatTime(gameStats.totalTime)}</div></div>
            `;

            // 成就数据
            const count = gameStats.achievements.length;
            document.getElementById('achieveProgress').textContent = 
                `(${count}/${achievements.length})`;

            document.getElementById('achieveContent').innerHTML = achievements.map(a => {
                const unlocked = gameStats.achievements.includes(a.id);
                return `
                    <div class="achievement-item ${unlocked ? 'unlocked' : ''}">
                        <div class="icon">${unlocked ? a.icon : '🔒'}</div>
                        <div class="name">${a.name}</div>
                        <div class="desc">${a.desc}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('statsModal').classList.add('show');
        }

        // 清除所有数据
        function confirmClearData() {
            if (confirm('确定要清除所有游戏记录吗？\n包括统计数据、关卡进度和成就，此操作不可恢复！')) {
                localStorage.removeItem('minesweeper_stats');
                gameStats = loadStats();
                renderLevelGrid();
                updateCustomLock();
                showStats();
                alert('记录已清除！');
            }
        }

        // 关闭弹窗
        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // 显示成就解锁通知
        let toastQueue = [];
        let isShowingToast = false;

        function showAchievementToast(achievement) {
            toastQueue.push(achievement);
            processToastQueue();
        }

        function processToastQueue() {
            if (isShowingToast || toastQueue.length === 0) return;
            
            isShowingToast = true;
            const achievement = toastQueue.shift();
            const toast = document.getElementById('achievementToast');
            
            document.getElementById('toastIcon').textContent = achievement.icon;
            document.getElementById('toastName').textContent = achievement.name;
            
            // 重置动画
            const iconEl = document.querySelector('.toast-icon');
            iconEl.style.animation = 'none';
            void iconEl.offsetWidth;
            iconEl.style.animation = 'toast-bounce 0.6s ease-in-out';
            
            toast.classList.add('show');
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    isShowingToast = false;
                    processToastQueue();
                }, 500);
            }, 3000);
        }

        // 事件绑定
        btnNew.addEventListener('click', resetGame);
        
        btnMarkMode.addEventListener('click', () => {
            markMode = !markMode;
            btnMarkMode.classList.toggle('active', markMode);
        });

        btnAssist.addEventListener('click', () => {
            assistMode = !assistMode;
            btnAssist.classList.toggle('active', assistMode);
            if (!assistMode) {
                clearAssistHighlight();
            }
        });

        btnLevelMode.addEventListener('click', () => switchMode('level'));
        
        btnCustomMode.addEventListener('click', () => {
            // 检查是否解锁
            if (gameStats.levelsCompleted.length < UNLOCK_CUSTOM_AT) {
                alert(`通过${UNLOCK_CUSTOM_AT}关后解锁自定义模式！\n当前进度: ${gameStats.levelsCompleted.length}/${UNLOCK_CUSTOM_AT}`);
                return;
            }
            switchMode('custom');
        });

        btnStatsBtn.addEventListener('click', showStats);

        document.getElementById('btnNextLevel').addEventListener('click', () => {
            closeModal('winModal');
            if (currentLevel < 10) {
                currentLevel++;
                const levelConfig = LEVELS.find(l => l.level === currentLevel);
                ROWS = levelConfig.rows;
                COLS = levelConfig.cols;
                MINES = levelConfig.mines;
                renderLevelGrid();
                resetGame();
            }
        });

        document.getElementById('btnBackToLevels').addEventListener('click', () => {
            closeModal('winModal');
            renderLevelGrid();
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (gameOver && e.key === 'Enter') {
                resetGame();
            }
        });

        // 检查自定义模式锁定状态
        function updateCustomLock() {
            if (gameStats.levelsCompleted.length < UNLOCK_CUSTOM_AT) {
                btnCustomMode.classList.add('locked');
                btnCustomMode.title = `通过${UNLOCK_CUSTOM_AT}关后解锁`;
            } else {
                btnCustomMode.classList.remove('locked');
                btnCustomMode.title = '';
            }
        }

        // 初始化
        renderLevelGrid();
        updateCustomLock();
        switchMode('level');
        resetGame();
    </script>
    <script src="fullscreen-btn.js"></script>
</body>
</html>
