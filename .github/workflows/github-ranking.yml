name: Update GitHub Ranking Data

on:
  schedule:
    # 每天 UTC 2:00（北京时间 10:00）执行
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 需要写入权限来提交数据文件

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch GitHub ranking data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-ranking.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "frontend/GitHub Ranking/data/"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update github ranking data $(date -u +%Y-%m-%d)"
            git push
          fi
